<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>transauto — Sistema de Ponto Eletrônico</title>
<!-- ===== PWA / App ===== -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#123a8f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ponto transauto">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
</script>
<!-- ===== Banco de dados na nuvem (Firebase) — sincroniza os dados entre todos os aparelhos ===== -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<!-- ===== Supabase — cópia de segurança em dobro dos dados (além do Firebase) ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
/* ============================ TEMA / PALETA ============================ */
:root{
  /* Paleta em azul marinho */
  --blue:#1f3a68; --blue-600:#14284d; --green:#10B981; --green-600:#059669;
  --pink:#e7649e; --pink-600:#d5488a; --babyblue:#3c62a4; --babyblue-soft:#e6ecf6; --pink-soft:#fdecf4;
  --surface-1:#ffffff; --surface-2:#eef1f8; --page:#e8ecf4;
  --text-1:#0b0f19; --text-2:#52596b; --muted:#8a90a2;
  --grid:#e6e8ee; --border:rgba(11,15,25,.10); --ring:rgba(31,58,104,.35);
  --s-good:#0ca30c; --s-warn:#fab219; --s-serious:#ec835a; --s-crit:#d03b3b;
  --c1:#1f3a68; --c2:#1baf7a; --c3:#eda100; --c4:#7d5fd0; --c5:#e7649e; --c6:#eb6834;
  --shadow:0 1px 2px rgba(11,15,25,.04),0 8px 24px rgba(11,15,25,.06);
  --radius:16px;
  --logo-ink:#14284d;
}
html[data-theme="dark"]{
  --blue:#3a5a9c; --blue-600:#2c4880; --pink:#ec7bad; --pink-600:#e7649e; --babyblue:#4f70b4; --babyblue-soft:#1b2740; --pink-soft:#3a1f2c;
  --surface-1:#16181d; --surface-2:#1d2026; --page:#0d0e11;
  --text-1:#f4f5f7; --text-2:#b7bcc9; --muted:#8a90a2;
  --grid:#2a2d34; --border:rgba(255,255,255,.10); --ring:rgba(58,90,156,.45);
  --c1:#3a5a9c; --c2:#199e70; --c3:#c98500; --c4:#9a83e6; --c5:#ec7bad; --c6:#d95926;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);
  --logo-ink:#5c93ec;
}
.tlogo{height:38px;width:auto;display:block}
.brand-logo .tlogo{height:54px}
.side-brand .tlogo{height:28px}
.logo-emblem{width:38px;height:38px;border-radius:11px;flex:0 0 38px;display:grid;place-items:center;
  background:linear-gradient(135deg,#123a8f,#0d2c6f);box-shadow:0 6px 16px rgba(18,58,143,.32)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--page); color:var(--text-1);
  -webkit-font-smoothing:antialiased; transition:background .3s,color .3s;
}
button{font-family:inherit;cursor:pointer}
a{color:var(--blue);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--grid);border-radius:8px}

/* ============================ LOGIN ============================ */
#login{position:fixed;inset:0;display:grid;place-items:center;
  background:radial-gradient(1200px 700px at 20% -10%,rgba(31,58,104,.24),transparent),
             radial-gradient(1000px 600px at 100% 110%,rgba(60,98,164,.26),transparent),var(--page);
  z-index:50;padding:20px}
/* Padrão de circuito decorativo no fundo do login — puramente visual (fica atrás do
   cartão de login, que tem fundo opaco), pedido do administrador pra ficar mais "tech". */
.login-ckt{position:absolute;inset:0;width:100%;height:100%;opacity:.35;pointer-events:none}
.login-card{position:relative;z-index:1;width:100%;max-width:420px;background:var(--surface-1);border:1px solid var(--border);
  border-radius:24px;box-shadow:var(--shadow);padding:34px 30px;animation:pop .5s cubic-bezier(.2,.9,.3,1.2)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--babyblue),var(--blue-600));
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;box-shadow:0 6px 16px rgba(31,58,104,.34),inset 0 1px 0 rgba(255,255,255,.3)}
.brand h1{font-size:22px;margin:0}
.brand small{color:var(--muted)}
.field{margin-top:16px}
.field label{display:block;font-size:13px;color:var(--text-2);margin-bottom:6px;font-weight:600}
.input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--text-1);font-size:15px;outline:none;transition:.2s}
.input:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--ring)}
/* Botões 3D (degradê azul, relevo e elevação) */
.btn{border:none;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px;
  display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .15s,box-shadow .15s,filter .15s;color:#fff}
.btn.primary{background:linear-gradient(135deg,var(--babyblue),var(--blue) 42%,var(--blue-600));
  box-shadow:0 6px 16px rgba(31,58,104,.34),inset 0 1px 0 rgba(255,255,255,.28)}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(31,58,104,.45),inset 0 1px 0 rgba(255,255,255,.28)}
.btn.primary:active{transform:translateY(0)}
.btn.block{width:100%}
.btn.ghost{background:var(--surface-1);color:var(--text-1);border:1px solid var(--border);box-shadow:0 2px 5px rgba(11,15,25,.07)}
.btn.ghost:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 6px 14px rgba(11,15,25,.1)}
.btn.green{background:linear-gradient(135deg,#3ed6a4,var(--green) 45%,var(--green-600));box-shadow:0 6px 16px rgba(16,185,129,.32),inset 0 1px 0 rgba(255,255,255,.28)}
.btn.green:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(16,185,129,.42)}
.btn.pink{background:linear-gradient(135deg,#f59bc4,var(--pink) 45%,var(--pink-600));box-shadow:0 6px 16px rgba(231,100,158,.32),inset 0 1px 0 rgba(255,255,255,.28)}
.btn.pink:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(231,100,158,.42)}
.btn.danger{background:linear-gradient(135deg,#e46a6a,var(--s-crit));box-shadow:0 6px 16px rgba(208,59,59,.32),inset 0 1px 0 rgba(255,255,255,.22)}
.btn.danger:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(208,59,59,.42)}
.btn:active{filter:brightness(.97)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px;box-shadow:0 3px 8px rgba(31,58,104,.22),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.sm.ghost{box-shadow:0 2px 5px rgba(11,15,25,.07)}
/* Abas segmentadas (Registros / Acompanhar) */
.segbar{display:inline-flex;gap:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:16px;flex-wrap:wrap}
.segbtn{border:none;background:transparent;color:var(--text-2);font-weight:700;font-size:14px;padding:9px 16px;border-radius:9px;transition:.15s}
.segbtn:hover{color:var(--text-1)}
.segbtn.active{background:var(--surface-1);color:var(--blue);box-shadow:0 1px 2px rgba(11,15,25,.08)}
/* Lista de colaboradores no Acompanhar do Admin */
.emp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:14px}
.emp-pick{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid var(--border);border-radius:12px;
  background:var(--surface-2);color:var(--text-1);font:inherit;text-align:left;transition:.15s}
.emp-pick:hover{border-color:var(--pink);background:var(--surface-1)}
.emp-pick-arrow{margin-left:auto;color:var(--muted);font-size:20px;font-weight:700}
.demo{margin-top:18px;padding-top:16px;border-top:1px dashed var(--border);display:grid;gap:8px}
.demo p{margin:0 0 4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.demo-btn{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--text-1);text-align:left;width:100%}
.demo-btn:hover{border-color:var(--blue)}
.demo-btn .av{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700}

/* ============================ APP SHELL ============================ */
#app{display:none;min-height:100vh}
.layout{display:grid;grid-template-columns:266px 1fr;min-height:100vh;transition:grid-template-columns .25s}
.layout.collapsed{grid-template-columns:74px 1fr}
.sidebar{background:var(--surface-1);border-right:1px solid var(--border);padding:16px 12px;
  position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.side-brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
.side-brand .logo{width:36px;height:36px;font-size:16px;border-radius:10px}
.side-brand span{font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden}
.nav-i{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;color:var(--text-2);
  font-weight:600;font-size:14px;border:none;background:none;width:100%;text-align:left;white-space:nowrap}
.nav-i:hover{background:var(--surface-2);color:var(--text-1)}
.nav-i.active{background:linear-gradient(135deg,rgba(31,58,104,.18),rgba(60,98,164,.14));color:var(--blue);box-shadow:inset 3px 0 0 var(--blue)}
.nav-i .ic{width:22px;text-align:center;font-size:17px;flex:0 0 22px}
.nav-i>span:not(.ic):not(.badge){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-badge{flex:0 0 auto}
.layout.collapsed .side-brand span,.layout.collapsed .nav-i span,.layout.collapsed .nav-sec{display:none}
.nav-sec{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:14px 12px 4px}
.nav-badge{animation:navpulse 1.7s ease-in-out infinite;padding:3px 8px;font-size:11px;margin-left:8px}
@keyframes navpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.layout.collapsed .nav-badge{margin-left:0 !important;position:absolute;top:4px;right:4px;min-width:16px;height:16px;padding:0 3px;font-size:10px}
.layout.collapsed .nav-i{position:relative}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;
  padding:12px 22px;background:color-mix(in srgb,var(--surface-1) 85%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--surface-2);
  color:var(--text-1);display:grid;place-items:center;font-size:17px}
.icon-btn:hover{border-color:var(--blue)}
.searchbar{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:12px;padding:9px 12px;color:var(--muted)}
.searchbar input{border:none;background:none;outline:none;color:var(--text-1);width:100%;font-size:14px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--text-1);
  background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:8px 12px}
.clock small{color:var(--muted);font-weight:600;font-size:11px;display:block}
.avatar{width:40px;height:40px;border-radius:12px;object-fit:cover;border:2px solid var(--border);background:var(--surface-2)}
.user-chip{display:flex;align-items:center;gap:10px;padding:5px 10px 5px 6px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2)}
.user-chip b{font-size:13px;display:block}
.user-chip small{font-size:11px;color:var(--muted)}
.notif{position:relative}
.notif .dot{position:absolute;top:0;right:0;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--s-crit);
  border:2px solid var(--surface-1);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;line-height:1}

.content{padding:22px;max-width:1280px;width:100%;margin:0 auto}
.page{display:none;animation:fade .35s}
.page.show{display:block}
.page-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.page-head h2{margin:0;font-size:24px}
.page-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ============================ CARDS / GRID ============================ */
.grid{display:grid;gap:16px}
.g-4{grid-template-columns:repeat(4,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:18px}
.card h3{margin:0 0 4px;font-size:15px}
.card .sub{color:var(--muted);font-size:12.5px;margin-bottom:12px}
.kpi{display:flex;flex-direction:column;gap:8px}
.kpi .top{display:flex;align-items:center;justify-content:space-between}
.kpi .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;color:#fff}
.kpi .val{font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.kpi .lbl{color:var(--text-2);font-size:13px;font-weight:600}
.kpi .delta{font-size:12px;font-weight:700;padding:3px 8px;border-radius:20px;display:inline-flex;gap:4px;align-items:center}
.up{color:var(--s-good);background:rgba(12,163,12,.12)}
.down{color:var(--s-crit);background:rgba(208,59,59,.12)}

.badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:5px}
.b-good{color:var(--s-good);background:rgba(12,163,12,.13)}
.b-warn{color:#a06a00;background:rgba(250,178,25,.18)}
.b-crit{color:var(--s-crit);background:rgba(208,59,59,.13)}
.b-info{color:var(--blue);background:rgba(37,99,235,.13)}
.b-mut{color:var(--text-2);background:var(--surface-2)}
html[data-theme="dark"] .b-warn{color:#fab219}

/* ============================ TABELA ============================ */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;
  letter-spacing:.4px;padding:10px 12px;border-bottom:1px solid var(--border)}
td{padding:11px 12px;border-bottom:1px solid var(--border);color:var(--text-1);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
.tavatar{width:30px;height:30px;border-radius:9px;object-fit:cover;background:var(--surface-2)}
.uname{display:flex;align-items:center;gap:10px}
.uname b{font-size:13.5px}.uname small{color:var(--muted);font-size:11.5px;display:block}
.tbl-wrap{overflow-x:auto}

/* ============================ REGISTRO DE PONTO ============================ */
.punch-hero{background:linear-gradient(135deg,rgba(31,58,104,.16),rgba(60,98,164,.12));
  border:1px solid var(--border);border-radius:22px;padding:26px;display:grid;
  grid-template-columns:1.1fr 1fr;gap:26px;align-items:center}
.punch-clock{font-size:52px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px}
.punch-date{color:var(--text-2);font-size:15px;text-transform:capitalize;margin-top:2px}
.next-badge{margin-top:16px;display:inline-flex;align-items:center;gap:10px;background:var(--surface-1);
  border:1px solid var(--border);border-radius:14px;padding:10px 16px;font-weight:700}
.next-badge .pill{width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.2)}
.punch-btn{width:100%;aspect-ratio:1/.62;border:none;border-radius:20px;color:#fff;font-size:22px;font-weight:800;
  background:linear-gradient(135deg,var(--babyblue),var(--blue) 45%,var(--blue-600));
  box-shadow:0 14px 34px rgba(31,58,104,.4),inset 0 2px 0 rgba(255,255,255,.28);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
.punch-btn:hover{transform:translateY(-2px);box-shadow:0 20px 48px rgba(31,58,104,.5),inset 0 2px 0 rgba(255,255,255,.28)}
.punch-btn:active{transform:scale(.98)}
.punch-btn .big{font-size:40px}
.punch-btn.done{background:linear-gradient(135deg,#7c8ba1,#475569);box-shadow:none}
.timeline{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.tl-step{flex:1;min-width:120px;background:var(--surface-1);border:1px solid var(--border);border-radius:14px;padding:12px 14px}
.tl-step.filled{border-color:var(--green);background:linear-gradient(135deg,rgba(16,185,129,.10),transparent)}
.tl-step .k{font-size:12px;color:var(--muted);font-weight:600}
.tl-step .t{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.tl-step.filled .t{color:var(--green-600)}
html[data-theme="dark"] .tl-step.filled .t{color:var(--green)}

/* ===== Barra de progresso da jornada (card "Jornada em Andamento") ===== */
.jbar-row{display:flex;align-items:baseline;justify-content:space-between;margin:14px 0 9px}
.jbar-time{font-variant-numeric:tabular-nums;font-weight:800;font-size:26px}
.jbar-time small{font-weight:600;color:var(--muted);font-size:14px;margin-left:6px}
.jbar-track{position:relative;height:30px;border-radius:99px;background:var(--surface-2);
  box-shadow:inset 0 1px 2px rgba(11,15,25,.12);overflow:hidden}
.jbar-fill{position:relative;height:100%;border-radius:99px;width:0%;
  background:linear-gradient(90deg,var(--babyblue),var(--c2));
  transition:width .6s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 10px rgba(27,175,122,.45);
  display:flex;align-items:center;justify-content:flex-end;padding-right:12px}
.jbar-fill::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.35));
  width:26px;right:0;left:auto;animation:jbarSheen 2.6s ease-in-out infinite}
.jbar-fill.warn{background:linear-gradient(90deg,var(--c2),var(--s-warn))}
.jbar-fill.good{background:var(--s-good);box-shadow:0 0 10px rgba(12,163,12,.4)}
.jbar-fill.good::after{display:none}
.jbar-fill b{color:#fff;font-size:13px;font-weight:800;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.3);font-variant-numeric:tabular-nums}
/* Com a barra bem cheia (%) pequena, o rótulo não cabe dentro do preenchimento — nesse caso
   ele sai da barra e aparece à direita, sobre o trilho vazio, em vez de ficar cortado. */
.jbar-pct-out{position:absolute;top:50%;right:12px;transform:translateY(-50%);
  color:var(--text-2);font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
@keyframes jbarSheen{0%,100%{opacity:.55}50%{opacity:1}}
.jbar-marks{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--muted);font-weight:600}
.jbar-extra{margin-top:9px;font-size:12px;font-weight:700;color:#a06a00;display:flex;align-items:center;gap:5px}
html[data-theme="dark"] .jbar-extra{color:#e0a835}

/* progress ring */
.ring-wrap{display:flex;align-items:center;gap:18px}
.ring{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.ring .bg{stroke:var(--grid)}
.ring .fg{stroke:var(--green);transition:stroke-dashoffset 1s ease}

/* ============================ MODAL ============================ */
.overlay{position:fixed;inset:0;background:rgba(6,8,15,.55);backdrop-filter:blur(3px);
  z-index:60;display:none;place-items:center;padding:20px}
.overlay.show{display:grid;animation:fade .2s}
.modal{background:var(--surface-1);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);
  width:100%;max-width:520px;max-height:90vh;overflow:auto;animation:pop .3s cubic-bezier(.2,.9,.3,1.2)}
.modal.wide{max-width:760px}
.modal-head{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--border)}
.modal-head h3{margin:0;font-size:18px}
.modal-body{padding:20px 22px}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
textarea.input{resize:vertical;min-height:80px}
select.input{appearance:none}

/* toast */
#toasts{position:fixed;top:18px;right:18px;z-index:80;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--surface-1);border:1px solid var(--border);border-left:4px solid var(--green);
  border-radius:12px;box-shadow:var(--shadow);padding:12px 16px;min-width:260px;display:flex;gap:10px;align-items:center;
  animation:slidein .3s}
.toast.err{border-left-color:var(--s-crit)}
.toast.info{border-left-color:var(--blue)}
.toast b{font-size:13.5px}.toast small{color:var(--muted);font-size:12px;display:block}

/* success animation */
#success{position:fixed;inset:0;z-index:90;display:none;place-items:center;background:rgba(6,8,15,.5);backdrop-filter:blur(4px)}
#success.show{display:grid}
.success-card{background:var(--surface-1);border-radius:24px;padding:40px 46px;text-align:center;box-shadow:var(--shadow);animation:pop .4s}
.check{width:96px;height:96px;margin:0 auto 14px}
.check circle{fill:none;stroke:var(--green);stroke-width:6;stroke-dasharray:283;stroke-dashoffset:283;animation:draw .5s .1s forwards}
.check path{fill:none;stroke:var(--green);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .4s .5s forwards}
.success-card h3{margin:6px 0 2px;font-size:22px}
.success-card p{margin:0;color:var(--muted)}

/* misc */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:8px 13px;border-radius:20px;border:1px solid var(--border);background:var(--surface-1);
  font-size:13px;font-weight:600;color:var(--text-2)}
.chip.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.map{height:150px;border-radius:14px;border:1px solid var(--border);background:
  linear-gradient(0deg,var(--grid) 1px,transparent 1px) 0 0/26px 26px,
  linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/26px 26px,var(--surface-2);
  position:relative;overflow:hidden}
.map .pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);font-size:30px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.map .acc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:90px;height:90px;border-radius:50%;
  background:rgba(37,99,235,.18);border:2px solid rgba(37,99,235,.5)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dh{text-align:center;font-size:11px;color:var(--muted);font-weight:700;padding:4px}
.cal .d{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;background:var(--surface-2);border:1px solid transparent;position:relative}
.cal .d .dot{width:6px;height:6px;border-radius:50%;margin-top:3px}
.cal .d.today{border-color:var(--blue);color:var(--blue)}
.cal .d.off{opacity:.35}
.cal .d.sun{color:var(--s-crit)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.divider{height:1px;background:var(--border);margin:16px 0}
.mini-list{display:flex;flex-direction:column;gap:2px}
.mini-item{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:10px}
.mini-item:hover{background:var(--surface-2)}
.mini-item .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:15px;flex:0 0 34px}
.mini-item .txt{flex:1;min-width:0}
.mini-item b{font-size:13.5px;display:block}
.mini-item small{color:var(--muted);font-size:12px}
.mini-item .time{color:var(--muted);font-size:12px;white-space:nowrap}

@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slidein{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}

/* responsive */
.menu-toggle{display:none}
@media(max-width:1024px){.g-4{grid-template-columns:repeat(2,1fr)}.g-3{grid-template-columns:1fr}.punch-hero{grid-template-columns:1fr}}

  .menu-toggle{display:grid}
  .g-2,.row2{grid-template-columns:1fr}

<script>
/* ============================ ESTADO / DADOS MOCK ============================ */
const AV = (bg,txt)=>`data:image/svg+xml;utf8,`+encodeURIComponent(
  `<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80'><rect width='80' height='80' rx='16' fill='${bg}'/><text x='50%' y='54%' font-family='sans-serif' font-size='30' font-weight='700' fill='white' text-anchor='middle' dominant-baseline='middle'>${txt}</text></svg>`);
// Avatar de um funcionário, buscado ao vivo (não deve ser copiado dentro de cada registro — isso incha o documento na nuvem)
function empAvatar(nome){
  const e=(state.employees||[]).find(x=>x.nome===nome);
  if(e&&e.av)return e.av;
  if(state.user&&state.user.nome===nome&&state.user.av)return state.user.av;
  const ini=(nome||'?').trim().split(' ').filter(Boolean).slice(0,2).map(p=>p[0].toUpperCase()).join('')||'?';
  return AV('#8a90a2',ini);
}

const state = {
  theme:'light', role:null, user:null, page:'dashboard', collapsed:false,
  punchesByEmp:{}, // por funcionário -> por data: {entrada,saida}
  employees:[],      // cadastrados pelo administrador
  adjustments:[],
  logs:[],
  holidays:[
    {data:'2026-07-09',nome:'Rev. Constitucionalista (SP)',tipo:'Estadual'},
    {data:'2026-09-07',nome:'Independência do Brasil',tipo:'Nacional'},
    {data:'2026-10-12',nome:'N. Sra. Aparecida',tipo:'Nacional'},
    {data:'2026-11-15',nome:'Proclamação da República',tipo:'Nacional'},
    {data:'2026-12-25',nome:'Natal',tipo:'Nacional'},
  ],
  vacations:[],
  afastamentos:[],
  escalas:[
    {nome:'5x2',desc:'Segunda a sexta',h:'08:00 – 17:00',a:'1h almoço',c:'var(--c1)',n:0},
    {nome:'6x1',desc:'Seis dias, folga 1',h:'10:00 – 19:00',a:'1h almoço',c:'var(--c2)',n:0},
    {nome:'12x36',desc:'12h trabalho / 36h folga',h:'07:00 – 19:00',a:'1h almoço',c:'var(--c4)',n:0},
    {nome:'Personalizada',desc:'Configurável por dia',h:'Variável',a:'—',c:'var(--c3)',n:0},
  ],
  folha:[],
  notifications:[],
  registros:[],
  folhaFechada:false,
  closedPeriods:{}, // nome do colaborador -> lista de períodos fechados (chave AAAA-MM do início)
  fechamentos:[], // fechamentos de ponto feitos pelos colaboradores (o Admin vê aqui)
  config:{liberarDomingo:false,liberarFeriado:false}, // liberações de registro definidas pelo Admin
  lastGeo:null,
  // Registra exclusões intencionais (registro de ponto excluído pelo admin, solicitação de ajuste
  // cancelada pelo colaborador) para que a mesclagem com a nuvem não "ressuscite" o item excluído
  // — sem isso, toda vez que qualquer aparelho salvasse depois, buscava o dado antigo do servidor
  // (que ainda tinha o item) e o trazia de volta, porque a mesclagem só sabe adicionar/atualizar,
  // nunca remover. Ver deletedKeys em mergeRegistros/applyRemote/saveToCloudMerged.
  deletedKeys:[],
};

const SCHED = ['entrada','saida'];
const SCHED_LABEL={entrada:'Entrada',saida:'Saída'};
const todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};

/* ==================================================================== */
/* ===== PERSISTÊNCIA / BANCO DE DADOS NA NUVEM (Firebase) ============ */
/* ==================================================================== */
/* >>> COLE AQUI a configuração do projeto Firebase (o administrador cria — é grátis).
   Enquanto estiver vazia, o sistema funciona salvando SÓ neste aparelho (não sincroniza
   entre celulares). Assim que a configuração for colada, os cadastros do Admin passam a
   aparecer em qualquer aparelho. */
const firebaseConfig = {
  apiKey: "AIzaSyCeV2b3tntXgGTpQdk8LOMy787zebZZAGY",
  authDomain: "ponto-cariacicaes.firebaseapp.com",
  projectId: "ponto-cariacicaes",
  storageBucket: "ponto-cariacicaes.firebasestorage.app",
  messagingSenderId: "859559207223",
  appId: "1:859559207223:web:9f2d734f2fcf412e8b3ab2"
};

/* ==================================================================== */
/* ===== SUPABASE — cópia de segurança em dobro (além do Firebase) ==== */
/* ==================================================================== */
/* Migração pedida pelo administrador: enquanto o Firebase continua sendo a fonte principal
   (nada muda no funcionamento atual), TODO ponto registrado e TODA gravação no banco também
   são enviadas em paralelo para o Supabase — sem bloquear, sem substituir e sem depender do
   Firebase. Se o envio ao Supabase falhar (sem internet, serviço fora do ar etc.), o registro
   fica numa fila local (localStorage) e é reenviado sozinho assim que a conexão voltar, então
   nenhuma informação deixa de ser gravada lá por causa de uma falha momentânea de rede.
   Usa só a "chave publicável" (anon key) — segura para uso no navegador, do mesmo jeito que a
   apiKey do Firebase acima já é usada hoje. A chave secreta (service_role) nunca entra aqui. */
const supabaseConfig = {
  url: "https://wxkjobtcqjeisgzctcii.supabase.co",
  anonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4a2pvYnRjcWplaXNnemN0Y2lpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3ODcwMjksImV4cCI6MjEwMzM2MzAyOX0.0B1bfp0MbhsgJkJvGX7KIi13y-nq6rw4r8PYLr1wxz4"
};
let supa=null, supaReady=false;
function initSupabase(){
  try{
    if(typeof window.supabase!=='undefined'&&supabaseConfig&&supabaseConfig.url&&supabaseConfig.anonKey){
      supa=window.supabase.createClient(supabaseConfig.url,supabaseConfig.anonKey);
      supaReady=true;
      flushSupabaseQueue();
      flushSupabaseDeleteQueue();
      flushSupabaseSnapshot();
      // Confere (e completa sozinho) qualquer lacuna entre o que existe aqui e o que está no
      // Supabase — rede de segurança pra além da fila normal, ver reconcileSupabaseRegistros().
      setTimeout(reconcileSupabaseRegistros,20000);
    }
  }catch(e){console.warn('Supabase indisponível:',e&&e.message);supaReady=false;}
}
function supaQueueGet(){try{return JSON.parse(localStorage.getItem('pontoapp_supabase_queue')||'[]');}catch(e){return [];}}
function supaQueueSet(arr){try{localStorage.setItem('pontoapp_supabase_queue',JSON.stringify(arr));}catch(e){}}
// Enfileira (ou atualiza, se já enfileirado) por reg_id — usado ANTES de tentar enviar, não só
// quando o envio falha (ver sendRegistroToSupabase).
function supaQueueUpsert(row){
  const q=supaQueueGet();
  const idx=q.findIndex(x=>x&&x.reg_id===row.reg_id);
  if(idx>=0)q[idx]=row;else q.push(row);
  if(q.length>2000)q.splice(0,q.length-2000);
  supaQueueSet(q);
}
function supaQueueRemove(regId){
  const q=supaQueueGet();
  const next=q.filter(x=>!x||x.reg_id!==regId);
  if(next.length!==q.length)supaQueueSet(next);
}
// Reenvia o que ficou preso na fila (falhas anteriores de rede/serviço). Cada item tem seu próprio
// "reg_id" único, então reenviar não cria duplicata — upsert substitui se já existir. Remove cada
// item individualmente (em vez de sobrescrever a fila inteira no final) para não perder um item
// novo que tenha entrado na fila enquanto este flush ainda estava rodando.
async function flushSupabaseQueue(){
  if(!supaReady||!supa)return;
  const q=supaQueueGet();
  if(!q.length)return;
  for(const row of q){
    try{
      const {error}=await supa.from('registros_ponto').upsert(row,{onConflict:'reg_id'});
      if(!error)supaQueueRemove(row.reg_id);
    }catch(e){/* mantém na fila, tenta de novo depois */}
  }
}
function supaRowFromRegistro(r){
  // registrado_em não pode ser nulo no Supabase — registros bem antigos (de antes desse campo
  // existir) não têm r.at; sem esse fallback, o envio falhava pra sempre (violação de not-null)
  // e ficava preso na fila de novo a cada tentativa, sem nunca conseguir ser gravado.
  const at=r.at||(r.data&&r.hora?new Date(r.data+'T'+r.hora+':00').toISOString():new Date().toISOString());
  return{
    reg_id:String(r.id),emp:r.emp,data:r.data,tipo:r.tipo,hora:r.hora,
    lat:r.lat!=null?r.lat:null,lon:r.lon!=null?r.lon:null,cidade:r.cidade||null,estado:r.estado||null,
    endereco:r.addr||null,precisao:r.prec!=null?r.prec:null,ip:r.ip||null,disp:r.disp||null,
    janta:!!r.janta,registrado_em:at
  };
}
// Envia UM ponto (entrada/saída) assim que é registrado — chamado direto de registrarPonto(),
// em paralelo ao Firebase, sem esperar nem depender dele. Nunca lança erro pra fora: se falhar,
// fica na fila e tenta de novo depois.
async function sendRegistroToSupabase(r){
  const row=supaRowFromRegistro(r);
  // Enfileira ANTES de tentar enviar: se a aba fechar, o app for para segundo plano ou a conexão
  // cair bem no meio do envio, o registro já está salvo na fila local e é reenviado sozinho depois.
  // Antes só entrava na fila quando o envio respondia com erro — uma tentativa interrompida no meio
  // (não uma falha) não deixava rastro nenhum, e o registro nunca mais era reenviado sozinho.
  supaQueueUpsert(row);
  if(!supaReady||!supa)return;
  try{
    const {error}=await supa.from('registros_ponto').upsert(row,{onConflict:'reg_id'});
    if(error){console.warn('Supabase (registro) falhou, mantido na fila:',error.message);return;}
    supaQueueRemove(row.reg_id);
  }catch(e){console.warn('Supabase (registro) falhou, mantido na fila:',e&&e.message);}
}
// Envia uma cópia completa do estado (todos os colaboradores, ajustes, notificações etc.) sempre
// que o app salva na nuvem — mantém no Supabase um espelho independente de tudo, não só dos pontos.
// Guarda o último envio que falhou e tenta de novo sozinho (flushSupabaseSnapshot), em vez de só
// esperar a próxima mudança de estado pra tentar mandar uma cópia mais atual.
let lastSnapshotData=null, snapshotRetryPending=false;
async function sendSnapshotToSupabase(data){
  lastSnapshotData=data;
  if(!supaReady||!supa){snapshotRetryPending=true;return;}
  try{
    const {error}=await supa.from('pontoapp_snapshot').upsert({id:1,dados:data,atualizado_em:new Date().toISOString()});
    if(error){console.warn('Supabase (cópia completa) falhou, tenta de novo em breve:',error.message);snapshotRetryPending=true;return;}
    snapshotRetryPending=false;
  }catch(e){console.warn('Supabase (cópia completa) falhou, tenta de novo em breve:',e&&e.message);snapshotRetryPending=true;}
}
function flushSupabaseSnapshot(){
  if(!supaReady||!supa||!snapshotRetryPending||!lastSnapshotData)return;
  sendSnapshotToSupabase(lastSnapshotData);
}
// ===== Exclusão espelhada — pedido do administrador: "se no sistema o colaborador excluir o
// ponto, no Supabase também tem que excluir" (confirmarExcluirRegistro() chama isso). Mesmo
// padrão de fila local dos envios acima: se falhar (sem internet etc.), fica na fila e é
// reenviado sozinho, então a exclusão nunca deixa de se propagar para o espelho.
function supaDeleteQueueGet(){try{return JSON.parse(localStorage.getItem('pontoapp_supabase_delete_queue')||'[]');}catch(e){return [];}}
function supaDeleteQueueSet(arr){try{localStorage.setItem('pontoapp_supabase_delete_queue',JSON.stringify(arr));}catch(e){}}
function supaDeleteQueuePush(regId){const q=supaDeleteQueueGet();if(!q.includes(regId)){q.push(regId);if(q.length>2000)q.splice(0,q.length-2000);supaDeleteQueueSet(q);}}
function supaDeleteQueueRemove(regId){
  const q=supaDeleteQueueGet();
  const next=q.filter(x=>x!==regId);
  if(next.length!==q.length)supaDeleteQueueSet(next);
}
async function flushSupabaseDeleteQueue(){
  if(!supaReady||!supa)return;
  const q=supaDeleteQueueGet();
  if(!q.length)return;
  for(const regId of q){
    try{
      const {error}=await supa.from('registros_ponto').delete().eq('reg_id',regId);
      if(!error)supaDeleteQueueRemove(regId);
    }catch(e){/* mantém na fila, tenta de novo depois */}
  }
}
async function deleteRegistroFromSupabase(regId){
  regId=String(regId);
  supaDeleteQueuePush(regId);
  if(!supaReady||!supa)return;
  try{
    const {error}=await supa.from('registros_ponto').delete().eq('reg_id',regId);
    if(error){console.warn('Supabase (exclusão) falhou, mantida na fila:',error.message);return;}
    supaDeleteQueueRemove(regId);
  }catch(e){console.warn('Supabase (exclusão) falhou, mantida na fila:',e&&e.message);}
}
// ===== Reconciliação periódica — rede de segurança final. Compara os registros que existem aqui
// com os que existem no Supabase e completa sozinho qualquer lacuna (ex.: um envio que foi
// interrompido de um jeito que nem chegou a cair na fila normal). Roda pouco depois de abrir o
// app e depois a cada poucos minutos; só faz INSERT/UPSERT de registros que faltam — nunca apaga
// nada aqui, então não tem risco de remover dado real por engano.
async function fetchAllSupaRegIds(){
  const ids=new Set();
  let from=0;const pageSize=1000;
  while(true){
    const {data,error}=await supa.from('registros_ponto').select('reg_id').range(from,from+pageSize-1);
    if(error||!data)break;
    data.forEach(x=>ids.add(String(x.reg_id)));
    if(data.length<pageSize)break;
    from+=pageSize;
    if(from>50000)break; // trava de segurança
  }
  return ids;
}
let reconcilingRegistros=false;
async function reconcileSupabaseRegistros(){
  if(!supaReady||!supa||reconcilingRegistros)return;
  reconcilingRegistros=true;
  try{
    const supaIds=await fetchAllSupaRegIds();
    const missing=(state.registros||[]).filter(r=>r&&r.id!=null&&!supaIds.has(String(r.id)));
    if(missing.length){
      const rows=missing.map(supaRowFromRegistro);
      const {error}=await supa.from('registros_ponto').upsert(rows,{onConflict:'reg_id'});
      if(error)console.warn('Reconciliação Supabase falhou:',error.message);
      else console.info(`Reconciliação Supabase: ${rows.length} registro(s) completado(s).`);
    }
  }catch(e){console.warn('Reconciliação Supabase falhou:',e&&e.message);}
  reconcilingRegistros=false;
}

const PERSIST_KEYS=['employees','deletedKeys','adjustments','logs','holidays','vacations','afastamentos','escalas','folha','notifications','registros','closedPeriods','fechamentos','punchesByEmp','config'];
let db=null, cloudReady=false, sessionReady=false, cloudLoaded=false, applyingRemote=false, saveTimer=null, lastPushed='';

function stableJSON(src){const o={};PERSIST_KEYS.forEach(k=>o[k]=src?src[k]:undefined);return JSON.stringify(o);}
function persistSlice(){const o={};PERSIST_KEYS.forEach(k=>o[k]=state[k]);return o;}
function trimGrowth(){
  if(state.logs&&state.logs.length>500)state.logs=state.logs.slice(0,500);
  // As notificações ficam ordenadas da mais nova pra mais antiga (mergeByIdLastWriteWinsSorted),
  // então manter as "últimas 250" da lista (slice(-250)) na verdade descartava as MAIS NOVAS e
  // mantinha as mais antigas — por isso avisos de solicitação de ajuste recém-chegados sumiam
  // sem aviso assim que o total passava de 250. Agora mantém sempre as 250 mais recentes.
  if(state.notifications&&state.notifications.length>250)state.notifications=state.notifications.slice(0,250);
  // Cada registro nunca deve carregar cópia do avatar (SVG embutido) — isso incha o documento
  // salvo na nuvem (limite de 1MB do Firestore). O avatar é sempre buscado ao vivo via empAvatar().
  if(state.registros)for(const r of state.registros)if(r.av)delete r.av;
  // deletedKeys só cresce (nunca é reordenado), então manter as últimas 1000 (slice do fim) é
  // seguro — ao contrário de notifications, aqui a ordem de inserção nunca muda.
  if(state.deletedKeys&&state.deletedKeys.length>1000)state.deletedKeys=state.deletedKeys.slice(-1000);
}
function scheduleSave(){
  if(!sessionReady||applyingRemote)return;
  clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,500);
}
// Detecta uma queda súbita e suspeita em qualquer lista importante (ex.: funcionários ou
// registros caindo de 9/160 para 0) comparando o que está prestes a ser salvo com o que
// realmente está na nuvem agora (baseline). Isso é o que impede um aparelho com cache
// antigo/vazio de "limpar" os dados reais de todo mundo com uma gravação normal.
function suspiciousShrink(newData,baseline){
  if(!baseline)return false;
  const keys=['employees','registros','adjustments','notifications','logs','fechamentos','holidays','vacations','escalas'];
  for(const k of keys){
    const oldLen=Array.isArray(baseline[k])?baseline[k].length:0;
    const newLen=Array.isArray(newData[k])?newData[k].length:0;
    if(oldLen>=3&&newLen<oldLen*0.5)return{key:k,oldLen,newLen};
  }
  return false;
}
let shrinkBlockSince=null, shrinkBlockNotified=false;
function saveNow(){
  trimGrowth();
  const data=persistSlice();
  const js=stableJSON(data);
  if(js===lastPushed)return;
  try{localStorage.setItem('pontoapp_v2',js);}catch(e){}
  // Só grava na nuvem DEPOIS de ter carregado os dados do servidor, para nunca
  // sobrescrever os cadastros existentes com um estado vazio ao atualizar/abrir o sistema.
  if(cloudReady&&cloudLoaded&&db){
    lastPushed=js; // otimista — evita reprocessar o mesmo estado várias vezes enquanto a mesclagem roda
    cloudWriteChain=cloudWriteChain.then(()=>saveToCloudMerged(data)).catch(e=>console.warn('Falha ao salvar na nuvem:',e&&e.message));
  } else {
    lastPushed=js;
    sendSnapshotToSupabase(data); // Firebase indisponível: manda mesmo assim uma cópia pro Supabase
  }
}
/* ===== Mesclagem segura de dados remotos =====
   O sistema salva TUDO em um único documento na nuvem. Como vários funcionários podem bater
   ponto quase ao mesmo tempo em aparelhos diferentes — ou um celular pode ficar minutos em
   segundo plano sem receber atualizações — uma gravação feita com dados desatualizados podia
   apagar um registro recém-criado em outro aparelho, ou fazer uma aprovação de ajuste "voltar"
   pra pendente porque o aparelho que salvou por último ainda não sabia da aprovação.
   Agora TODA gravação na nuvem primeiro busca o estado mais recente do servidor (saveToCloudMerged,
   mais abaixo) e faz uma mesclagem item a item: quando o mesmo item existe dos dois lados, vence
   o que foi alterado por último (mais recente); quando um item só existe de um lado, ele é mantido
   dentro da janela abaixo (MERGE_GRACE_MS).
   Essa janela era de só 60 segundos, pensada pra também servir de "detector de exclusão": um item
   só-local mais velho que isso era descartado, supondo que tinha sido excluído em outro aparelho.
   Só que isso fazia um registro de ponto batido com o celular sem sinal (comum pra quem trabalha
   na rua) sumir de vez assim que o app conseguia sincronizar de novo, se demorasse mais de 1 minuto
   pra reconectar — exatamente o tipo de perda que este sistema não pode ter. Agora que exclusões
   intencionais têm seu próprio registro (deletedKeys, veja mergeRegistros/cancelAdjust/
   confirmarExcluirRegistro), a janela não precisa mais ser curta pra "detectar exclusão" — ela só
   protege contra reviver caches realmente antigos. Por isso foi ampliada pra 7 dias. */
const MERGE_GRACE_MS=7*24*60*60*1000;
function regKey(r){return r&&[r.emp,r.data,r.tipo,r.hora,r.manual?1:0].join('|');}
// Chave de identidade de um registro para mesclagem: usa o "id" estável (todo registro criado ou
// editado a partir de agora tem um) e só cai pra chave composta antiga em registros legados sem id.
function regMergeKey(r){return r&&(r.id!=null?('id:'+r.id):regKey(r));}
function regTs(r){return r&&r.at?new Date(r.at).getTime():0;}
function newId(){return Date.now()+'_'+Math.random().toString(36).slice(2,8);}
// Mescla dois arrays do mesmo tipo (ex.: duas versões de "adjustments") escolhendo, pra cada item
// que existe nos dois lados, o que foi alterado mais recentemente — em vez de um lado sempre
// "vencer" cegamente (era isso que fazia uma aprovação recém-feita ser sobrescrita por um aparelho
// desatualizado). Um item que só existe de um lado é mantido, com uma janela de tolerância pra não
// ressuscitar algo excluído há muito tempo por outra pessoa.
function mergeByIdLastWriteWins(local,remote,keyFn,tsFn){
  local=(local||[]).filter(Boolean);remote=(remote||[]).filter(Boolean);
  const out={};
  remote.forEach(x=>{out[keyFn(x)]=x;});
  const now=Date.now();
  local.forEach(x=>{
    const k=keyFn(x),r=out[k];
    if(!r){
      const ts=tsFn(x)||0;
      if(ts&&(now-ts)<MERGE_GRACE_MS)out[k]=x;
      return;
    }
    if((tsFn(x)||0)>=(tsFn(r)||0))out[k]=x;
  });
  return Object.values(out);
}
// deadSet (opcional): Set com chaves 'reg:'+regMergeKey(r) de registros excluídos intencionalmente
// pelo admin. Sem isso, mergeByIdLastWriteWins (que só sabe ADICIONAR/ATUALIZAR, nunca remover)
// trazia de volta um registro excluído assim que qualquer aparelho buscava o servidor de novo —
// a exclusão nunca "pegava" de verdade.
function mergeRegistros(local,remote,deadSet){
  let merged=mergeByIdLastWriteWins(local,remote,regMergeKey,regTs);
  if(deadSet&&deadSet.size)merged=merged.filter(r=>!deadSet.has('reg:'+regMergeKey(r)));
  merged.sort((a,b)=>a.data!==b.data?(a.data<b.data?1:-1):((a.hora||'')!==(b.hora||'')?((a.hora||'')<(b.hora||'')?1:-1):0));
  return merged;
}
function mergeClosedPeriods(local,remote){
  const out={};
  const names=new Set([...Object.keys(local||{}),...Object.keys(remote||{})]);
  names.forEach(n=>{out[n]=Array.from(new Set([...(remote&&remote[n]||[]),...(local&&local[n]||[])]));});
  return out;
}
function mergePunchesByEmp(local,remote){
  local=local||{};remote=remote||{};
  const out={};
  const now=Date.now();
  const ids=new Set([...Object.keys(local),...Object.keys(remote)]);
  ids.forEach(id=>{
    const l=local[id]||{},r=remote[id]||{};
    const days=new Set([...Object.keys(l),...Object.keys(r)]);
    const dayOut={};
    days.forEach(day=>{
      const ld=l[day]||{},rd=r[day]||{};
      const m={...rd};
      ['entrada','saida'].forEach(f=>{
        if(ld[f]&&rd[f]){
          // Os dois lados têm horário pra esse campo: vence o mais recente (antes o local
          // sempre ganhava, mesmo quando era mais antigo — causa direta de horários "voltando".)
          const tl=ld[f].at?new Date(ld[f].at).getTime():0, tr=rd[f].at?new Date(rd[f].at).getTime():0;
          m[f]=tl>=tr?ld[f]:rd[f];
        }else if(ld[f]&&!rd[f]){
          const ts=ld[f].at?new Date(ld[f].at).getTime():0;
          if(ts&&(now-ts)<MERGE_GRACE_MS)m[f]=ld[f];
        }
      });
      Object.keys(ld).forEach(k=>{if(k!=='entrada'&&k!=='saida'&&m[k]===undefined)m[k]=ld[k];});
      if(Object.keys(m).length)dayOut[day]=m;
    });
    if(Object.keys(dayOut).length)out[id]=dayOut;
  });
  return out;
}
// Mescla por último-que-escreveu-vence e devolve já ordenado do mais novo pro mais antigo — sem
// isso, um item novo (unshift no array local) podia terminar no FIM da lista mesclada, porque
// mergeByIdLastWriteWins usa a ordem de inserção do objeto interno, não a ordem original dos
// arrays. Era por isso que uma solicitação de ajuste recém-criada aparecia embaixo da lista em
// vez de sempre vir por cima.
function mergeByIdLastWriteWinsSorted(local,remote,keyFn,tsFn){
  const merged=mergeByIdLastWriteWins(local,remote,keyFn,tsFn);
  merged.sort((a,b)=>(tsFn(b)||0)-(tsFn(a)||0));
  return merged;
}
// Une os dois lados mantendo TODOS os itens (nada é descartado) — usada para listas onde não faz
// sentido "um lado vencer o outro" porque os itens praticamente não são editados depois de
// criados (feriados, escalas). Um item só existe de um lado quando ainda não sincronizou.
function mergeUnionByKey(local,remote,keyFn){
  local=(local||[]).filter(Boolean);remote=(remote||[]).filter(Boolean);
  const out={};
  remote.forEach(x=>{out[keyFn(x)]=x;});
  local.forEach(x=>{const k=keyFn(x);if(!out[k])out[k]=x;});
  return Object.values(out);
}
// Feriados: une pela data (chave natural) e combina a liberação (se qualquer um dos lados
// liberou o registro nesse feriado, o resultado mesclado mantém liberado).
function mergeHolidays(local,remote){
  local=(local||[]).filter(Boolean);remote=(remote||[]).filter(Boolean);
  const out={};
  remote.forEach(h=>{out[h.data]={...h};});
  local.forEach(h=>{
    const ex=out[h.data];
    if(!ex){out[h.data]={...h};return;}
    out[h.data]={...ex,...h,liberado:!!(ex.liberado||h.liberado)};
  });
  return Object.values(out).sort((a,b)=>(a.data||'').localeCompare(b.data||''));
}
// Escalas só são criadas, nunca editadas — uma união simples pelo nome já resolve.
function mergeEscalas(local,remote){return mergeUnionByKey(local,remote,e=>e.nome);}
// Logs de auditoria: "nada é apagado" (é a própria promessa da tela) — por isso é sempre união,
// nunca last-write-wins, ordenada do mais recente pro mais antigo.
function mergeLogs(local,remote){
  const merged=mergeUnionByKey(local,remote,l=>[l.quem,l.acao,l.alvo,l.hora].join('|'));
  merged.sort((a,b)=>(b.hora||'').localeCompare(a.hora||''));
  return merged;
}
function applyRemote(data){
  applyingRemote=true;
  PERSIST_KEYS.forEach(k=>{
    if(data[k]===undefined)return;
    if(k==='deletedKeys'){state.deletedKeys=mergeUnionByKey(state.deletedKeys,data.deletedKeys,d=>d.k);}
    else if(k==='registros'){
      const dead=new Set((state.deletedKeys||[]).map(d=>d.k));
      state.registros=mergeRegistros(state.registros,data.registros,dead);
    }
    else if(k==='punchesByEmp'){state.punchesByEmp=mergePunchesByEmp(state.punchesByEmp,data.punchesByEmp);}
    else if(k==='adjustments'){
      const dead=new Set((state.deletedKeys||[]).map(d=>d.k));
      state.adjustments=mergeByIdLastWriteWinsSorted(state.adjustments,data.adjustments,x=>'id:'+x.id,x=>x._ts||x.id||0).filter(a=>!dead.has('adj:'+a.id));
    }
    else if(k==='notifications'){state.notifications=mergeByIdLastWriteWinsSorted(state.notifications,data.notifications,x=>'id:'+x.id,x=>Math.floor(x.id)||0);}
    else if(k==='vacations'){state.vacations=mergeByIdLastWriteWinsSorted(state.vacations,data.vacations,x=>'id:'+x.id,x=>x._ts||x.id||0);}
    else if(k==='fechamentos'){state.fechamentos=mergeByIdLastWriteWins(state.fechamentos,data.fechamentos,x=>[x.emp,x.periodKey,x.tipo].join('|'),x=>x._ts||0);}
    else if(k==='closedPeriods'){state.closedPeriods=mergeClosedPeriods(state.closedPeriods,data.closedPeriods);}
    else if(k==='holidays'){state.holidays=mergeHolidays(state.holidays,data.holidays);}
    else if(k==='escalas'){state.escalas=mergeEscalas(state.escalas,data.escalas);}
    else if(k==='logs'){state.logs=mergeLogs(state.logs,data.logs);}
    else{state[k]=data[k];}
  });
  applyingRemote=false;
}
// Chamado pra CADA gravação na nuvem: busca o documento atual do servidor primeiro e mescla com
// o que temos aqui (mesma ideia do applyRemote, só que no sentido inverso — protegendo o servidor
// em vez da tela local). É isso que impede um aparelho com dados desatualizados (ex.: ficou minutos
// em segundo plano) de sobrescrever uma aprovação de ajuste ou um registro feito por outra pessoa
// nesse meio-tempo. As gravações são encadeadas (cloudWriteChain) pra nunca rodar duas ao mesmo
// tempo e uma resposta de rede fora de ordem desfazer a outra.
let cloudWriteChain=Promise.resolve();
async function saveToCloudMerged(data){
  const ref=db.collection('pontoapp').doc('dados');
  const snap=await ref.get();
  const remoto=snap.exists?snap.data():null;
  const merged={...data};
  if(remoto){
    merged.deletedKeys=mergeUnionByKey(data.deletedKeys,remoto.deletedKeys,d=>d.k);
    const dead=new Set((merged.deletedKeys||[]).map(d=>d.k));
    merged.registros=mergeRegistros(data.registros,remoto.registros,dead);
    merged.adjustments=mergeByIdLastWriteWinsSorted(data.adjustments,remoto.adjustments,x=>'id:'+x.id,x=>x._ts||x.id||0).filter(a=>!dead.has('adj:'+a.id));
    merged.notifications=mergeByIdLastWriteWinsSorted(data.notifications,remoto.notifications,x=>'id:'+x.id,x=>Math.floor(x.id)||0);
    merged.vacations=mergeByIdLastWriteWinsSorted(data.vacations,remoto.vacations,x=>'id:'+x.id,x=>x._ts||x.id||0);
    merged.fechamentos=mergeByIdLastWriteWins(data.fechamentos,remoto.fechamentos,x=>[x.emp,x.periodKey,x.tipo].join('|'),x=>x._ts||0);
    merged.punchesByEmp=mergePunchesByEmp(data.punchesByEmp,remoto.punchesByEmp);
    merged.closedPeriods=mergeClosedPeriods(data.closedPeriods,remoto.closedPeriods);
    merged.holidays=mergeHolidays(data.holidays,remoto.holidays);
    merged.escalas=mergeEscalas(data.escalas,remoto.escalas);
    merged.logs=mergeLogs(data.logs,remoto.logs);
  }
  const suspect=suspiciousShrink(merged,remoto);
  if(suspect){
    if(!shrinkBlockSince)shrinkBlockSince=Date.now();
    const waited=Date.now()-shrinkBlockSince;
    if(waited<30000){
      if(!shrinkBlockNotified){
        shrinkBlockNotified=true;
        try{pushNotif({for:'admin',ic:'⚠️',c:'var(--s-warn)',t:'Sincronização pausada por segurança',
          s:`Detectei uma queda súbita em "${suspect.key}" (${suspect.oldLen}→${suspect.newLen}) e pausei o envio para a nuvem para proteger os dados.`});}catch(e){}
      }
      console.warn(`Gravação na nuvem bloqueada: ${suspect.key} caiu de ${suspect.oldLen} para ${suspect.newLen}. (${Math.round(waited/1000)}s de pausa)`);
      lastPushed=''; // força reavaliar na próxima gravação, em vez de ficar preso achando que já sincronizou
      return;
    }
    console.warn(`Queda em ${suspect.key} liberada após ${Math.round(waited/1000)}s — tratando como alteração intencional.`);
  }
  shrinkBlockSince=null;shrinkBlockNotified=false;
  if(!applyingRemote){
    state.registros=merged.registros; state.adjustments=merged.adjustments; state.notifications=merged.notifications;
    state.vacations=merged.vacations; state.deletedKeys=merged.deletedKeys;
    state.fechamentos=merged.fechamentos; state.punchesByEmp=merged.punchesByEmp; state.closedPeriods=merged.closedPeriods;
    state.holidays=merged.holidays; state.escalas=merged.escalas; state.logs=merged.logs;
  }
  const jsFinal=stableJSON(merged);
  lastPushed=jsFinal;
  try{localStorage.setItem('pontoapp_v2',jsFinal);}catch(e){}
  await ref.set(JSON.parse(JSON.stringify(merged)));
  refreshUI();
  sendSnapshotToSupabase(merged); // cópia completa em paralelo — não bloqueia nem afeta o Firebase
}
function refreshUI(){
  if(state.role&&state.user){renderNav();render();updateNotifBadge();}
}
function loadLocal(){
  try{const raw=localStorage.getItem('pontoapp_v2');if(raw){applyRemote(JSON.parse(raw));lastPushed=stableJSON(state);}}catch(e){}
}
function initPersistence(){
  try{
    if(typeof firebase!=='undefined'&&firebaseConfig&&firebaseConfig.apiKey){
      firebase.initializeApp(firebaseConfig);
      db=firebase.firestore();
      cloudReady=true;
    }
  }catch(e){console.warn('Firebase indisponível — usando armazenamento local.',e&&e.message);cloudReady=false;}

  // Reconecta o administrador na hora (não depende dos dados do servidor)
  try{const s=readSession();if(s&&s.role==='admin')restoreSession();}catch(e){}

  if(!cloudReady){loadLocal();sessionReady=true;restoreSession();return;}

  // Carrega primeiro o que já está salvo NESTE aparelho, antes de esperar a resposta do servidor.
  // Isso é essencial: se um ponto foi batido e a tela foi fechada/atualizada antes da gravação na
  // nuvem terminar (rede lenta, ou o colaborador fechou o app rápido demais), esse ponto ficava só
  // na memória — e ao reabrir, a primeira resposta do Firestore (com o estado ANTIGO do servidor,
  // sem esse ponto) substituía tudo, e o ponto sumia de vez, mesmo intacto no armazenamento local.
  // O localStorage já é sempre atualizado no instante em que o ponto é batido (ver saveNow); só
  // faltava o app realmente OLHAR pra ele antes de aceitar cegamente o que o servidor mandar.
  // applyRemote faz mesclagem (não substituição), então carregar o cache local aqui e, na sequência,
  // mesclar a resposta do servidor por cima preserva o ponto pendente em vez de descartá-lo.
  try{
    const raw=localStorage.getItem('pontoapp_v2');
    if(raw)applyRemote(JSON.parse(raw));
  }catch(e){}

  let firstSync=true;
  const startSync=()=>{
    db.collection('pontoapp').doc('dados').onSnapshot(snap=>{
      if(!snap.exists){cloudLoaded=true;sessionReady=true;restoreSession();saveNow();return;}
      const incoming=snap.data();
      const js=stableJSON(incoming);
      if(js!==lastPushed){
        applyRemote(incoming); // mescla com o que já está em memória (inclusive o cache local acima)
        lastPushed=js;
      }
      cloudLoaded=true;sessionReady=true;restoreSession();refreshUI();
      if(firstSync){
        firstSync=false;
        // Se a mesclagem trouxe do cache local algo que o servidor ainda não tinha (um ponto batido
        // pouco antes de fechar o app, por exemplo), grava de volta agora — "cura" a diferença sem
        // esperar a próxima ação do usuário.
        saveNow();
      }
    },err=>{
      console.warn('Erro de sincronização:',err&&err.message);
      if(!sessionReady){loadLocal();sessionReady=true;restoreSession();refreshUI();toast('Modo local','Sem conexão com o servidor no momento.','info');}
    });
  };
  try{
    firebase.auth().signInAnonymously().then(startSync).catch(e=>{console.warn('Login anônimo falhou:',e&&e.message);startSync();});
  }catch(e){startSync();}

  // Rede de segurança: se o servidor não responder, cai para o modo local
  setTimeout(()=>{if(!sessionReady){console.warn('Sem resposta do servidor — modo local.');loadLocal();sessionReady=true;restoreSession();refreshUI();}},8000);
}

/* ===== Pontos por funcionário (cada colaborador tem sua própria jornada) ===== */
function empStore(id){if(id==null)return {};if(!state.punchesByEmp[id])state.punchesByEmp[id]={};return state.punchesByEmp[id];}
// O status "já bati entrada/saída hoje" (botão de registrar ponto, cartão do dashboard, jornada
// em andamento) agora é montado direto a partir de state.registros — a MESMA fonte usada pelo
// Espelho de Ponto, relatórios e Acompanhar Ponto — em vez do state.punchesByEmp separado.
// Antes, como os dois eram sincronizados/mesclados de forma independente (algoritmos diferentes),
// podiam ficar em desacordo (confirmado com dados reais de produção: dias em que o horário salvo
// em registros e o salvo em punchesByEmp divergiam pra mesma batida) — o colaborador via a
// entrada/saída "sumir" ou aparecer errada na tela dele, mesmo com o registro real intacto.
// Ter uma única fonte de verdade elimina essa classe inteira de divergência.
function myDayObj(){
  const nome=state.user&&state.user.nome;
  if(!nome)return {};
  const today=todayKey();
  const per=collectPonto(nome,d=>d===today);
  const row=per.rows.find(r=>r.data===today);
  const out={};
  if(row){
    if(row.entrada&&row.entrada!=='—')out.entrada={time:row.entrada};
    if(row.saida&&row.saida!=='—')out.saida={time:row.saida};
  }
  return out;
}
function myDayEnsure(){const id=state.user&&state.user.id;const st=empStore(id);if(!st[todayKey()])st[todayKey()]={};return st[todayKey()];}

/* ============================ JORNADA / HORA EXTRA ============================ */
function parseHM(hm){const [h,m]=hm.split(':').map(Number);const d=new Date();d.setHours(h,m,0,0);return d;}
function fmtMin(m){m=Math.max(0,Math.round(m));const h=Math.floor(m/60),mm=m%60;return `${String(h).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;}
function hmToMin(hm){const [h,m]=String(hm).split(':').map(Number);return (h||0)*60+(m||0);}
// Desconto fixo de 1h de almoço (12:00–13:00): retorna quantos minutos do intervalo
// trabalhado [iniMin,fimMin] caem dentro da janela do almoço (0 a 60 min).
function almocoOverlapMin(iniMin,fimMin){
  const ov=Math.min(fimMin,13*60)-Math.max(iniMin,12*60);
  return Math.max(0,Math.min(60,ov));
}
// Jornada cadastrada do funcionário (viria do cadastro). Ex.: 08:00–17:00
function jornadaInfo(){
  const u=state.user||{};
  const dow=new Date().getDay();
  const isSat=dow===6;   // sábado usa a jornada reduzida
  const isDescanso=dow===0||!!feriadoDe(todayKey());   // domingo/feriado: tudo é hora extra
  const j=(isSat&&u.jornadaSab)?u.jornadaSab:(u.jornada||'08:00–17:00');
  const [ini,fim]=j.split(/[–-]/).map(s=>s.trim());
  const t=myDayObj();
  // Prevista líquida: desconta da janela cadastrada (ex.: 08:00–17:00) a 1h de almoço que
  // cair dentro dela, para exigir 8h de TRABALHO (não 9h de janela) antes de virar hora extra.
  const previstaMin=isDescanso?0:Math.max(0,(parseHM(fim)-parseHM(ini))/60000-almocoOverlapMin(hmToMin(ini),hmToMin(fim)));
  let trabMin=0,emAndamento=false;
  if(t.entrada){
    const now=new Date();
    const iniMin=hmToMin(t.entrada.time);
    const fimMin=t.saida?hmToMin(t.saida.time):(now.getHours()*60+now.getMinutes());
    emAndamento=!t.saida;
    trabMin=Math.max(0,fimMin-iniMin-almocoOverlapMin(iniMin,fimMin)); // desconta 1h de almoço (12:00–13:00)
  }
  const extraMin=Math.max(0,trabMin-previstaMin);       // hora extra: passou da jornada
  const restanteMin=Math.max(0,previstaMin-trabMin);
  const pct=previstaMin?Math.min(100,Math.round(trabMin/previstaMin*100)):0;
  return {ini,fim,previstaMin,trabMin,extraMin,restanteMin,pct,emAndamento,temEntrada:!!t.entrada,temSaida:!!t.saida};
}
// Atualiza os números da jornada em tempo real (chamado no tick)
function updateJornadaLive(){
  if(state.role!=='colab'||state.page!=='dashboard')return;
  const el=id=>document.getElementById(id);
  if(!el('jExtra'))return;
  const j=jornadaInfo();
  const t=myDayObj();
  el('jExtra').textContent=fmtMin(j.extraMin);
  const jJanta=el('jJanta'); if(jJanta)jJanta.textContent=(t.saida&&t.saida.time>'18:59')?'Sim':'—';
  const jExtraKpi=el('jExtraKpi'); if(jExtraKpi)jExtraKpi.textContent=fmtMin(j.extraMin);
  const jTrab=el('jTrab'); if(jTrab)jTrab.textContent=fmtMin(j.trabMin);
  const jTrabKpi=el('jTrabKpi'); if(jTrabKpi)jTrabKpi.textContent=fmtMin(j.trabMin);
  const jRestante=el('jRestante'); if(jRestante)jRestante.textContent=fmtMin(j.restanteMin);
  const jPct=el('jPct'); if(jPct)jPct.textContent=j.pct+'%';
  const wrap=el('jExtraWrap');
  if(wrap)wrap.style.display=j.extraMin>0?'flex':'none';
  const ring=el('jRing');
  if(ring){const r=+ring.getAttribute('r'),c=2*Math.PI*r;ring.style.strokeDasharray=c;ring.style.strokeDashoffset=c*(1-j.pct/100);
    ring.setAttribute('stroke',j.extraMin>0?'var(--s-warn)':'var(--c2)');}
  const st=el('jStatus');
  if(st){
    if(!j.temEntrada)st.innerHTML='<span class="pill" style="background:var(--muted)"></span> Aguardando registro de entrada';
    else if(j.emAndamento&&j.extraMin>0)st.innerHTML='<span class="pill" style="background:var(--s-warn)"></span> Em hora extra — '+fmtMin(j.extraMin)+' além da jornada';
    else if(j.emAndamento)st.innerHTML='<span class="pill"></span> Jornada em andamento';
    else st.innerHTML='<span class="pill" style="background:var(--s-good)"></span> Jornada encerrada';
  }
  // Barra de progresso da jornada (card "Jornada em Andamento")
  const jBarTime=el('jBarTime'); if(jBarTime)jBarTime.innerHTML=fmtMin(j.trabMin)+' <small>de '+fmtMin(j.previstaMin)+'</small>';
  const jBarPctIn=el('jBarPctIn'); if(jBarPctIn){jBarPctIn.textContent=j.pct+'%';jBarPctIn.style.display=j.pct>=25?'inline':'none';}
  const jBarPctOut=el('jBarPctOut'); if(jBarPctOut){jBarPctOut.textContent=j.pct+'%';jBarPctOut.style.display=j.pct<25?'inline':'none';}
  const jBarFill=el('jBarFill');
  if(jBarFill){jBarFill.style.width=j.pct+'%';jBarFill.className='jbar-fill'+(jBarState(j)?' '+jBarState(j):'');}
  const jBarExtra=el('jBarExtra');
  if(jBarExtra){jBarExtra.style.display=j.extraMin>0?'flex':'none';jBarExtra.innerHTML='⚡ +'+fmtMin(j.extraMin)+' além da jornada';}
}

const empLogin=e=>(e.login||e.email);

/* ===== Sessão: mantém o usuário logado ao atualizar a página/app ===== */
let restoringSession=false;
function readSession(){try{return JSON.parse(localStorage.getItem('pontoapp_session')||'null');}catch(e){return null;}}
function saveSession(){
  try{
    let s=null;
    if(state.role==='admin')s={role:'admin'};
    else if(state.role==='colab'&&state.user)s={role:'colab',id:state.user.id,email:state.user.email};
    if(s){localStorage.setItem('pontoapp_session',JSON.stringify(s));}
  }catch(e){}
}
function clearSession(){try{localStorage.removeItem('pontoapp_session');}catch(e){}}
function restoreSession(){
  if(state.role)return;                 // já está logado
  const s=readSession();if(!s)return;
  restoringSession=true;
  try{
    // Mantém o usuário logado ao atualizar a página, mas o sistema sempre abre na tela inicial
    // (o login já deixa state.page='dashboard' — não restauramos mais a última tela visitada).
    if(s.role==='admin'){loginAdmin();}
    else if(s.role==='colab'){
      const emp=state.employees.find(e=>(s.id!=null&&e.id===s.id)||(s.email&&empLogin(e).toLowerCase()===String(s.email).toLowerCase()));
      if(emp&&emp.status!=='inativo'){loginAsEmployee(emp);}else{clearSession();}
    }
  }finally{restoringSession=false;}
}
function enterApp(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  state.page='dashboard';state.q='';state.empStatus='todos';
  document.getElementById('topAvatar').src=state.user.av;
  document.getElementById('topName').textContent=state.user.nome;
  document.getElementById('topRole').textContent=state.user.role;
  renderNav();render();
  saveSession();
  if(!restoringSession)toast('Bem-vindo(a)!',state.user.nome,'info');
}

}

  };
  // Fecha o período anterior automaticamente assim que o colaborador entra (login ou reabertura

const ADMIN_USER='admin';
const ADMIN_PASS='Ts-Sala8';
function doLogin(){
  const em=document.getElementById('loginEmail').value.trim();
  const pw=document.getElementById('loginPass').value;
  if(!em||!pw)return toast('Preencha os dados','Informe usuário e senha.','err');
  if(em.toLowerCase()===ADMIN_USER){
    if(pw!==ADMIN_PASS)return toast('Senha incorreta','Verifique a senha do administrador.','err');
    return loginAdmin();
  }
  if(cloudReady&&!sessionReady)return toast('Conectando ao servidor…','Aguarde alguns segundos e tente novamente.','info');
  const emp=state.employees.find(e=>empLogin(e).toLowerCase()===em.toLowerCase());

  if(empSenha(emp)!==pw)return toast('Senha incorreta','Tente novamente.','err');
  if(emp.status==='inativo')return toast('Usuário inativo','Seu acesso está bloqueado. Fale com o administrador.','err');
  loginAsEmployee(emp);
}

function toast(title,msg,type='ok'){
  const el=document.createElement('div');
  el.className='toast '+(type==='err'?'err':type==='info'?'info':'');
  el.innerHTML=`<span style="font-size:18px">${type==='err'?'⚠️':type==='info'?'🔔':'✅'}</span><div><b>${title}</b><small>${msg||''}</small></div>`;

function pushNotif(n){
  // unshift (não push): o array de notificações fica ordenado da mais nova pra mais antiga
  // (mesma convenção usada na mesclagem com a nuvem — mergeByIdLastWriteWinsSorted), então uma
  // notificação nova tem que entrar na frente, não no fim. Colocá-la no fim fazia ela cair fora
  // do corte de trimGrowth (as 250 mais recentes) assim que a lista passava de 250 itens — a
  // solicitação era salva, mas o aviso pro admin nunca sobrevivia.
  state.notifications.unshift({id:Date.now()+Math.random(),tm:'agora',read:false,...n});
  updateNotifBadge();scheduleSave();
}

/* ============================ GEOLOCALIZAÇÃO ============================ */
function deviceInfo(){
  const ua=navigator.userAgent;
  let os='Desconhecido';
  if(/Windows/.test(ua))os='Windows';else if(/Mac/.test(ua))os='macOS';else if(/Android/.test(ua))os='Android';
  else if(/iPhone|iPad/.test(ua))os='iOS';else if(/Linux/.test(ua))os='Linux';
  let br='Navegador';
  if(/Edg/.test(ua))br='Edge';else if(/Chrome/.test(ua))br='Chrome';else if(/Firefox/.test(ua))br='Firefox';else if(/Safari/.test(ua))br='Safari';
  const dev=/Mobi|Android|iPhone/.test(ua)?'Celular':/iPad|Tablet/.test(ua)?'Tablet':'Desktop';
  return {os,br,dev};
}
function getGeo(){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation)return reject('Geolocalização não suportada pelo navegador.');
    navigator.geolocation.getCurrentPosition(
      async pos=>{
        const {latitude,longitude,accuracy}=pos.coords;
        let addr='Endereço não disponível',cidade='—',estado='—';
        try{
          const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&accept-language=pt-BR`,{headers:{'Accept':'application/json'}});
          const j=await r.json(); const a=j.address||{};
          addr=j.display_name||addr;
          cidade=a.city||a.town||a.village||a.municipality||'—';
          estado=a.state||'—';
        }catch(e){/* offline: mantém coords */}
        resolve({latitude,longitude,accuracy:Math.round(accuracy),addr,cidade,estado});
      },
      err=>reject(err.code===1?'Permissão de localização negada. Não é possível registrar o ponto.':'Não foi possível obter sua localização.'),
      {enableHighAccuracy:true,timeout:12000}
    );
  });
}
