/* ============================ PERÍODO / FECHAMENTO (16 a 15) ============================ */
function periodBounds(d){
  const day=d.getDate();let start,end;
  if(day>=16){start=new Date(d.getFullYear(),d.getMonth(),16);end=new Date(d.getFullYear(),d.getMonth()+1,15);}
  else{start=new Date(d.getFullYear(),d.getMonth()-1,16);end=new Date(d.getFullYear(),d.getMonth(),15);}
  return {start,end};
}
const periodKey=b=>b.start.getFullYear()+'-'+String(b.start.getMonth()+1).padStart(2,'0');
const periodLabel=b=>b.start.toLocaleDateString('pt-BR')+' – '+b.end.toLocaleDateString('pt-BR');
const currentPeriod=()=>periodBounds(new Date());
function previousPeriod(){const c=currentPeriod();const d=new Date(c.start);d.setDate(d.getDate()-1);return periodBounds(d);}
// Reconstrói os limites {start,end} de um período a partir da sua periodKey (ex.: "2026-07"),
// usada em "Pontos Anteriores" pra abrir um período fechado específico do histórico.
function periodBoundsFromKey(pk){
  const [y,m]=pk.split('-').map(Number);
  return periodBounds(new Date(y,m-1,16));
}
const isPeriodClosed=(nome,b)=>(state.closedPeriods[nome]||[]).includes(periodKey(b));
function closePeriod(nome,b){const k=periodKey(b);state.closedPeriods[nome]=state.closedPeriods[nome]||[];if(!state.closedPeriods[nome].includes(k))state.closedPeriods[nome].push(k);}
function previousPeriodOpen(){
  if(!(state.role==='colab'&&state.user))return false;
  const prev=previousPeriod();
  const nome=state.user.nome;
  // Só considera "em aberto" se o colaborador REGISTROU ponto no período anterior e ainda não fechou.
  // Funcionário novo (sem registros) não é bloqueado; a contagem começa quando ele bate o primeiro ponto.
  const temAtividade=state.registros.some(r=>{
    if(r.emp!==nome||!r.data)return false;
    const dt=new Date(r.data+'T00:00:00');
    return dt>=prev.start&&dt<=prev.end;
  });
  return temAtividade&&!isPeriodClosed(nome,prev);
}
// Substituída por autoFecharPeriodoAnterior() — o sistema fecha o período sozinho agora, o
// colaborador não precisa mais confirmar nada. Função mantida sem uso (nenhuma tela chama mais)
// só para não quebrar nada caso algo externo ainda referencie o nome.
function alertPeriodoAberto(){
  const prev=previousPeriod();
  openModal({content:`<div class="modal-head"><h3>⚠️ Feche o período anterior</h3></div>
  <div class="modal-body">
    <p style="color:var(--text-2);font-size:14px;margin-top:0">O período <b>${periodLabel(prev)}</b> terminou e ainda está <b>em aberto</b>. Antes de registrar novos pontos, é necessário fechar o período anterior.</p>
    <div class="card" style="background:var(--surface-2);box-shadow:none"><div class="mini-list">
      ${infoLine('📅','Período pendente',periodLabel(prev))}
      ${infoLine('⏱️','Situação','Em aberto — aguardando seu fechamento')}
    </div></div>
  </div>
  <div class="modal-foot">
    <button class="btn ghost" onclick="closeModal();registrarPonto(document.querySelector('.punch-btn'),true)">Registrar mesmo assim</button>
    <button class="btn primary" onclick="fecharPeriodoAnterior()">🔒 Fechar período anterior</button>
  </div>`});
}
// Registra o fechamento do colaborador para o Administrador ver (com aviso verde). "tipo" indica
// a origem: fechamento manual do colaborador, do administrador (Fechar Folha), ou automático do
// sistema (autoFecharPeriodoAnterior) — tudo fica rastreável no histórico igual.
function registrarFechamento(nome,bounds,tipo){
  if(!state.fechamentos)state.fechamentos=[];
  state.fechamentos.unshift({emp:nome,periodo:periodLabel(bounds),periodKey:periodKey(bounds),tipo:tipo||'Ponto',at:new Date().toISOString().slice(0,16).replace('T',' '),_ts:Date.now(),seen:false});
  pushNotif({for:'admin',ic:'🔒',c:'var(--s-good)',t:'Ponto fechado'+(tipo&&tipo.includes('automat')?'':' pelo colaborador'),s:`${nome} • ${periodLabel(bounds)}`});
}
// Mantida sem uso — ver autoFecharPeriodoAnterior().
function fecharPeriodoAnterior(){
  const prev=previousPeriod();
  const already=isPeriodClosed(state.user.nome,prev);
  closePeriod(state.user.nome,prev);
  state.logs.unshift({quem:state.user.nome,acao:'Fechou período anterior',alvo:periodLabel(prev),ip:'201.9.88.3',hora:new Date().toISOString().slice(0,16).replace('T',' ')});
  if(!already)registrarFechamento(state.user.nome,prev,'Período anterior');
  closeModal();saveNow();render();toast('Período fechado',periodLabel(prev)+' foi encerrado.','info');
}
// Fecha o período anterior automaticamente, sem exigir nenhuma ação do colaborador — antes o
// colaborador via um aviso e precisava clicar em "Fechar período anterior"; agora, assim que o
// sistema percebe (ao entrar no app, ou ao bater um ponto) que o período anterior terminou e
// ainda está aberto, ele mesmo fecha e registra isso no histórico, de forma transparente.
function autoFecharPeriodoAnterior(){
  if(!previousPeriodOpen())return;
  const prev=previousPeriod();
  const nome=state.user.nome;
  closePeriod(nome,prev);
  state.logs.unshift({quem:'Sistema',acao:'Fechou período anterior automaticamente',alvo:nome+' • '+periodLabel(prev),ip:'—',hora:new Date().toISOString().slice(0,16).replace('T',' ')});
  registrarFechamento(nome,prev,'Fechado automaticamente pelo sistema');
  saveNow();
}
// Antes mostrava um aviso pedindo pro colaborador clicar em "Fechar agora"; agora o fechamento é
// automático (autoFecharPeriodoAnterior) — se por algum motivo esta função ainda for chamada com
// o período em aberto (ex.: o app ficou aberto atravessando a virada do período sem recarregar),
// ela mesma fecha na hora, em silêncio, sem interromper a tela do colaborador com nenhum aviso.
function bannerPeriodoAberto(){
  if(previousPeriodOpen())autoFecharPeriodoAnterior();
  return '';
}

// Feriado cadastrado para a data (chave AAAA-MM-DD), ou null
function feriadoDe(key){return (state.holidays||[]).find(h=>h.data===key)||null;}
// Verifica se o registro do colaborador está bloqueado nesta data (domingo/feriado),
// respeitando as liberações definidas pelo administrador. Retorna {motivo,msg} ou null.
function registroBloqueado(dateKey,dow){
  const cfg=state.config||{};
  if(dow===0 && !cfg.liberarDomingo) return {motivo:'domingo',msg:'Registro aos domingos requer liberação do administrador.'};
  const h=feriadoDe(dateKey);
  if(h && !cfg.liberarFeriado && !h.liberado) return {motivo:'feriado',msg:`Registro em feriado (${h.nome}) requer liberação do administrador.`};
  return null;
}
async function registrarPonto(btn,force){
  const next=nextPunch();
  if(!next){toast('Ponto completo','Você já registrou todos os pontos de hoje.','info');return;}
  const dow=new Date().getDay();
  const bloq=registroBloqueado(todayKey(),dow);
  if(bloq){toast('Registro bloqueado',bloq.msg,'err');return;}
  // Antes bloqueava o registro pedindo pro colaborador fechar o período anterior manualmente;
  // agora o sistema fecha sozinho (sem interromper o registro do ponto) e segue em frente.
  if(previousPeriodOpen())autoFecharPeriodoAnterior();
  if(btn){btn.disabled=true;btn.querySelector('.lbl').textContent='Obtendo localização…';}
  try{
    const geo=await getGeo();
    const now=new Date();
    const time=now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    const info=deviceInfo();
    const day=myDayEnsure();
    const ip='201.9.88.'+(1+Math.floor(Math.random()*250));
    day[next]={time,geo,info,ip,at:now.toISOString()};
    state.lastGeo={...geo,...info,time,tipo:SCHED_LABEL[next]};
    // Janta: fechamento (Saída) registrado após as 18:59
    const janta = (next==='saida' && time > '18:59');
    const novoRegistro={id:newId(),emp:state.user.nome,data:todayKey(),tipo:SCHED_LABEL[next],hora:time,
      lat:geo.latitude,lon:geo.longitude,addr:geo.addr,cidade:geo.cidade,estado:geo.estado,prec:geo.accuracy,ip,janta,
      disp:`${info.dev} • ${info.os} • ${info.br}`,at:now.toISOString()};
    state.registros.unshift(novoRegistro);
    // Grava também no Supabase, em paralelo e sem bloquear — assim o ponto fica registrado em
    // dois bancos independentes desde o instante em que é batido, não só depois da mesclagem.
    sendRegistroToSupabase(novoRegistro);
    pushNotif({for:'admin',ic:'📍',c:'var(--c2)',t:'Novo registro de ponto',s:`${state.user.nome} • ${SCHED_LABEL[next]} ${time} • ${geo.cidade}/${geo.estado}`});
    state.logs.unshift({quem:state.user.nome,acao:'Registrou '+SCHED_LABEL[next].toLowerCase(),
      alvo:`${time} • ${geo.latitude.toFixed(4)},${geo.longitude.toFixed(4)}`,ip:'201.9.88.3',
      hora:now.toISOString().slice(0,16).replace('T',' ')});
    if(janta){
      pushNotif({for:'admin',ic:'🍽️',c:'var(--c3)',t:'Janta registrada',s:`${state.user.nome} • saída ${time} (após 18:59)`});
      state.logs.unshift({quem:state.user.nome,acao:'Janta registrada (fechamento após 18:59)',alvo:`Saída ${time} • ${fmtd(todayKey())}`,ip:'201.9.88.3',hora:now.toISOString().slice(0,16).replace('T',' ')});
    }
    showSuccess(SCHED_LABEL[next]+' registrada!',(janta?'🍽️ Janta registrada • ':'')+`${time} • ${geo.cidade}/${geo.estado}`);
    // Grava imediatamente (não espera o debounce) para reduzir ao mínimo a chance de o
    // registro ser perdido caso outro aparelho sincronize dados quase ao mesmo tempo.
    saveNow();render();
  }catch(err){
    toast('Erro ao registrar',typeof err==='string'?err:'Falha na localização.','err');
    if(btn){btn.disabled=false;render();}
  }
}
function showSuccess(title,msg){
  document.getElementById('successTitle').textContent=title;
  document.getElementById('successMsg').textContent=msg;
  const s=document.getElementById('success');s.classList.add('show');
  s.querySelectorAll('.check circle,.check path').forEach(e=>{e.style.animation='none';e.offsetHeight;e.style.animation='';});
  setTimeout(()=>s.classList.remove('show'),1900);
}

/* ============================ GRÁFICOS (SVG) ============================ */
function barChart(data,{max,unit='h',color='var(--c1)',w=520,h=170}={}){
  const pad=28,bw=(w-pad*2)/data.length,mx=max||Math.max(...data.map(d=>d.v))*1.15||1;
  const bars=data.map((d,i)=>{
    const bh=(d.v/mx)*(h-pad*2),x=pad+i*bw+bw*0.22,y=h-pad-bh,bwi=bw*0.56;
    return `<g>
      <rect x="${x}" y="${y}" width="${bwi}" height="${bh}" rx="4" fill="${d.c||color}"><title>${d.l}: ${d.v}${unit}</title></rect>
      <text x="${x+bwi/2}" y="${h-pad+16}" text-anchor="middle" font-size="11" fill="var(--muted)">${d.l}</text>
      <text x="${x+bwi/2}" y="${y-6}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--text-2)">${d.v?d.v+unit:''}</text>
    </g>`;}).join('');
  let grid='';for(let g=0;g<=3;g++){const y=pad+g*((h-pad*2)/3);grid+=`<line x1="${pad}" y1="${y}" x2="${w-pad}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`;}
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="overflow:visible">${grid}<line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--border)" stroke-width="1.5"/>${bars}</svg>`;
}
function donut(pct,{label='',color='var(--c2)',size=150}={}){
  const r=size/2-16,c=2*Math.PI*r,off=c*(1-pct/100);
  return `<div style="display:flex;flex-direction:column;align-items:center">
    <svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--grid)" stroke-width="14"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round"
        stroke-dasharray="${c}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset 1s"/>
      <text x="50%" y="50%" transform="rotate(90 ${size/2} ${size/2})" text-anchor="middle" dominant-baseline="middle"
        font-size="26" font-weight="800" fill="var(--text-1)">${pct}%</text>
    </svg>${label?`<div style="color:var(--muted);font-size:12.5px;margin-top:6px">${label}</div>`:''}</div>`;
}
function lineChart(data,{w=520,h=160,color='var(--c1)'}={}){
  const pad=24,mx=Math.max(...data.map(d=>d.v))*1.15||1;
  const pts=data.map((d,i)=>[pad+i*((w-pad*2)/(data.length-1)),h-pad-(d.v/mx)*(h-pad*2)]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');
  const area=path+` L${pts[pts.length-1][0]} ${h-pad} L${pts[0][0]} ${h-pad} Z`;
  const dots=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${color}"><title>${data[i].l}: ${data[i].v}</title></circle>`).join('');
  const labs=data.map((d,i)=>`<text x="${pts[i][0]}" y="${h-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${d.l}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%">
    <defs><linearGradient id="lg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".25"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#lg)"/><path d="${path}" fill="none" stroke="${color}" stroke-width="2.5"/>${dots}${labs}</svg>`;
}

/* ============================ RENDER PRINCIPAL ============================ */
let renderRetryTimer=null;
function render(){
  const c=document.getElementById('content');
  // Se a pessoa está com um campo de formulário em foco (principalmente um <select> com o menu
  // nativo ABERTO), recriar o HTML agora fecharia o menu / atrapalharia a digitação no meio do
  // processo — o navegador destrói o elemento antigo junto com qualquer seletor nativo aberto.
  // Por isso a seleção de funcionário no Lançamento Manual não "pegava": bastava OUTRO
  // colaborador bater ponto em qualquer lugar (o que dispara uma atualização em tempo real aqui)
  // durante o clique no menu que ele fechava sozinho. Em vez disso, adia o render e tenta de novo
  // logo em seguida, sem perder o que já estava sendo preenchido.
  const active=document.activeElement;
  if(active && c.contains(active) && ['INPUT','SELECT','TEXTAREA'].includes(active.tagName)){
    clearTimeout(renderRetryTimer);
    renderRetryTimer=setTimeout(render,700);
    return;
  }
  const P={
    dashboard: state.role==='admin'?adminDashboard:colabDashboard,
    punch:colabPunch, history:colabHistory, acompanhar:colabAcompanhar, pontosAnteriores:colabPontosAnteriores, myadjust:colabAdjust, myabsences:colabAbsences, profile:colabProfile,
    employees:adminEmployees, registros:adminRegistros, adjustments:adminAdjustments, manualpunch:adminManualPunch, payroll:adminPayroll, schedules:adminSchedules,
    absences:adminAbsences, holidays:adminHolidays, reports:adminReports, logs:adminLogs,
  };
  // Rede de segurança extra: preserva valores já preenchidos por id, caso o render aconteça bem
  // no instante entre um campo perder o foco e o próximo ganhar foco.
  const preserved={};
  c.querySelectorAll('[id]').forEach(el=>{
    if(el.tagName==='INPUT'||el.tagName==='SELECT'||el.tagName==='TEXTAREA'){
      preserved[el.id]={value:el.value,focus:document.activeElement===el,
        selStart:(typeof el.selectionStart==='number')?el.selectionStart:null,
        selEnd:(typeof el.selectionEnd==='number')?el.selectionEnd:null};
    }
  });
  c.innerHTML=(P[state.page]||(()=>'<div class="card">Em construção…</div>'))();
  Object.keys(preserved).forEach(id=>{
    const el=document.getElementById(id);
    if(!el)return;
    const p=preserved[id];
    if(el.tagName==='SELECT'){
      if([...el.options].some(o=>o.value===p.value))el.value=p.value;
    }else{
      el.value=p.value;
    }
    if(p.focus){
      el.focus();
      if(p.selStart!==null&&el.setSelectionRange){try{el.setSelectionRange(p.selStart,p.selEnd);}catch(e){}}
    }
  });
  tick();updateNotifBadge();updateJornadaLive();renderBottomNav();scheduleSave();
}

function calendarCard(){

  const dh=['D','S','T','Q','Q','S','S'].map(d=>`<div class="dh">${d}</div>`).join('');

/* ===== Acompanhar Ponto (colaborador vê seus registros por mês) ===== */
function ymNow(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function ymLabel(ym){const [y,m]=ym.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});}
function ymShift(ym,delta){let [y,m]=ym.split('-').map(Number);m+=delta;while(m<1){m+=12;y--;}while(m>12){m-=12;y++;}return y+'-'+String(m).padStart(2,'0');}
function acompMonth(){return state.acompMonth||ymNow();}
function acompShift(delta){state.acompMonth=ymShift(acompMonth(),delta);render();}
// Monta os dias de ponto de um colaborador, JÁ aplicando os ajustes aprovados por cima.
// keep(dataISO) decide quais dias entram (mês, período, etc.)
function collectPonto(empName,keep){
  const days={};
  const tkMax=todayKey(); // nunca exibir data futura (protege contra fuso/relógio adiantado)
  // Jornada prevista do colaborador (para calcular a hora extra de cada dia)
  // Dias de semana usam a jornada normal; sábado usa a jornada reduzida (jornadaSab).
  const empObj=(state.employees||[]).find(e=>e.nome===empName);
  const jw=((empObj&&empObj.jornada)||'08:00–17:00').split(/[–-]/).map(s=>s.trim());
  // Prevista líquida: desconta a 1h de almoço que cai dentro da janela cadastrada, para exigir
  // 8h de TRABALHO (não 9h de janela) antes de contar hora extra — mesmo critério do dashboard.
  const previstaWeekday=Math.max(0,(parseHM(jw[1]||'17:00')-parseHM(jw[0]||'08:00'))/60000-almocoOverlapMin(hmToMin(jw[0]||'08:00'),hmToMin(jw[1]||'17:00')));
  const js=((empObj&&empObj.jornadaSab)||'08:00–12:00').split(/[–-]/).map(s=>s.trim());
  const previstaSab=Math.max(0,(parseHM(js[1]||'12:00')-parseHM(js[0]||'08:00'))/60000-almocoOverlapMin(hmToMin(js[0]||'08:00'),hmToMin(js[1]||'12:00')));
  const ensure=d=>{if(!days[d])days[d]={entrada:null,saida:null,adj:false,ferias:false};return days[d];};
  // Se por algum motivo existir mais de um registro do mesmo tipo no mesmo dia (ex.: lançamento
  // manual repetido), escolhe de forma DETERMINÍSTICA em vez de depender da ordem do array:
  // prioriza o que já foi ajustado e, empatando, o mais recente (campo "at").
  const filtrados=state.registros.filter(r=>r.emp===empName&&r.data&&r.data<=tkMax&&keep(r.data));
  const melhorPorChave={};
  filtrados.forEach(r=>{
    const k=r.data+'|'+r.tipo;
    const atual=melhorPorChave[k];
    if(!atual){melhorPorChave[k]=r;return;}
    const rGanha=(!!r.ajustado&&!atual.ajustado)?true:(!!atual.ajustado&&!r.ajustado)?false
      :(new Date(r.at||0).getTime()>new Date(atual.at||0).getTime());
    if(rGanha)melhorPorChave[k]=r;
  });
  Object.values(melhorPorChave).forEach(r=>{
    const day=ensure(r.data);
    if(r.tipo==='Entrada')day.entrada=r.hora;
    else if(r.tipo==='Saída')day.saida=r.hora;
  });
  // Ajustes aprovados/realizados corrigem ou adicionam o horário do dia
  state.adjustments.filter(a=>a.emp===empName&&(a.status==='aprovado'||a.status==='realizado')&&a.data&&a.data<=tkMax&&keep(a.data)).forEach(a=>{
    const day=ensure(a.data);
    if(a.tipo==='Entrada')day.entrada=a.para;
    else if(a.tipo==='Saída')day.saida=a.para;
    day.adj=true;
  });
  // Dias de férias aprovadas também entram no ponto do período, marcados como "Férias" — pedido
  // do administrador: se o colaborador saiu de férias, esses dias precisam aparecer destacados
  // como férias (na folha, na impressão e no histórico), em vez de ficarem em branco. Só marca o
  // dia como férias quando NÃO há nenhum registro real batido nele — se por algum motivo houver
  // um ponto no meio do período de férias, ele continua aparecendo normalmente, sem esconder nada.
  (state.vacations||[]).filter(v=>v.emp===empName&&v.status==='agendada'&&v.ini&&v.fim).forEach(v=>{
    let cur=new Date(v.ini+'T12:00:00');
    const fim=new Date(v.fim+'T12:00:00');
    while(cur<=fim){
      const dk=cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-'+String(cur.getDate()).padStart(2,'0');
      if(dk<=tkMax&&keep(dk)&&!days[dk])ensure(dk).ferias=true;
      cur.setDate(cur.getDate()+1);
    }
  });
  const dias=Object.keys(days).sort();
  const rows=[]; let jantas=0, extraTotalMin=0;
  dias.forEach(d=>{
    const day=days[d];
    if(day.ferias){
      rows.push({data:d,entrada:'—',saida:'—',total:'Férias',extraMin:0,extra:'—',janta:false,ajustado:false,ferias:true});
      return;
    }
    const jantou=!!(day.saida&&day.saida>'18:59'); if(jantou)jantas++;
    let total='—', extraMin=0;
    if(day.entrada&&day.saida){
      const iniMin=hmToMin(day.entrada),fimMin=hmToMin(day.saida);
      const worked=Math.max(0,fimMin-iniMin-almocoOverlapMin(iniMin,fimMin)); // desconta 1h de almoço (12:00–13:00)
      total=fmtMin(worked);
      const dow=new Date(d+'T12:00:00').getDay();
      let prevista=previstaWeekday;                 // seg. a sex.
      if(dow===6)prevista=previstaSab;              // sábado: jornada reduzida
      if(dow===0)prevista=0;                        // domingo: descanso -> tudo é hora extra
      if(feriadoDe(d))prevista=0;                   // feriado: tudo é hora extra
      extraMin=Math.max(0,worked-prevista);   // hora extra: o que passou da jornada prevista do dia
      extraTotalMin+=extraMin;
    }
    rows.push({data:d,entrada:day.entrada||'—',saida:day.saida||'—',total,extraMin,extra:extraMin>0?fmtMin(extraMin):'—',janta:jantou,ajustado:day.adj});
  });
  return {rows,jantas,dias:dias.length,extraTotalMin,extraTotal:fmtMin(extraTotalMin),feriasDias:rows.filter(r=>r.ferias).length};
}

/* conta dias corridos (inclusivo) entre duas datas ISO */
function contarDias(ini,fim){
  if(!ini||!fim)return 0;
  const a=new Date(ini+'T00:00:00'),b=new Date(fim+'T00:00:00');
  if(b<a)return -1;
  return Math.round((b-a)/86400000)+1;
}
function contarUteis(ini,fim){
  if(!ini||!fim)return 0;
  let a=new Date(ini+'T00:00:00'),b=new Date(fim+'T00:00:00'),n=0;
  if(b<a)return 0;
  const feriados=state.holidays.map(h=>h.data);
  for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1)){
    const dow=d.getDay();
    if(dow!==0&&dow!==6&&!feriados.includes(d.toISOString().slice(0,10)))n++;
  }
  return n;
}

function uploadPhoto(){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{const img=new Image();img.onload=()=>{
      const size=160,cv=document.createElement('canvas');cv.width=size;cv.height=size;
      const ctx=cv.getContext('2d'),s=Math.min(img.width,img.height);
      ctx.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size);
      setMyAvatar(cv.toDataURL('image/jpeg',0.8));toast('Foto atualizada','Upload concluído com sucesso.','info');
    };img.onerror=()=>{setMyAvatar(r.result);};img.src=r.result;};r.readAsDataURL(f);};
  inp.click();
}

}

function saveEmployee(id){
  const get=x=>document.getElementById(x).value.trim();
  const jornada=(get('fJorIni')||'08:00')+'–'+(get('fJorFim')||'17:00');
  const jornadaSab=(get('fJorSabIni')||'08:00')+'–'+(get('fJorSabFim')||'12:00');
  let setor=get('fSetor'); if(setor==='__outro__')setor=get('fSetorOutro');
  let funcao=get('fFuncao'); if(funcao==='__outro__')funcao=get('fFuncaoOutro');
  const data={nome:get('fNome'),email:get('fEmail'),setor,funcao,escala:get('fEscala'),jornada,jornadaSab,status:get('fStatus')};
  const senha=get('fSenha')||'123456';
  if(!data.nome){toast('Erro','Informe o nome.','err');return;}
  if(!data.email){toast('Erro','Informe o e-mail / login do usuário.','err');return;}
  if(!setor){toast('Erro','Selecione o setor.','err');return;}
  if(!funcao){toast('Erro','Selecione a função.','err');return;}
  const dup=state.employees.find(e=>empLogin(e).toLowerCase()===data.email.toLowerCase()&&e.id!==id);
  if(dup||data.email.toLowerCase()===ADMIN_USER){toast('Login em uso','Este login não está disponível (reservado ou já usado).','err');return;}
  if(id){
    const e=state.employees.find(x=>x.id===id);
    Object.assign(e,data,{login:data.email,senha});
    state.logs.unshift({quem:'Admin',acao:'Editou funcionário / usuário',alvo:e.nome,ip:'187.12.44.9',hora:new Date().toISOString().slice(0,16).replace('T',' ')});
    closeModal();render();toast('Salvo',e.nome+' foi atualizado.','info');
  }else{
    const ini=data.nome.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
    const emp={id:Date.now(),banco:'+00:00',av:AV('#1f3a68',ini),login:data.email,senha,
      matricula:'FN-'+String(state.employees.length+1).padStart(5,'0'),
      admissao:new Date().toLocaleDateString('pt-BR'),...data};
    state.employees.push(emp);
    state.logs.unshift({quem:'Admin',acao:'Cadastrou funcionário e criou usuário',alvo:`${emp.nome} • login: ${emp.login}`,ip:'187.12.44.9',hora:new Date().toISOString().slice(0,16).replace('T',' ')});
    closeModal();render();afterCreateUser(emp);
  }
}

  else state.config.liberarFeriado=!state.config.liberarFeriado;
  const on=tipo==='domingo'?state.config.liberarDomingo:state.config.liberarFeriado;
  state.logs.unshift({quem:'Admin',acao:(on?'Liberou':'Bloqueou')+' registro',alvo:(tipo==='domingo'?'Domingos':'Feriados'),ip:'187.12.44.9',hora:new Date().toISOString().slice(0,16).replace('T',' ')});
  saveNow();render();
  toast('Liberação atualizada',(tipo==='domingo'?'Domingos':'Feriados')+': '+(on?'registro liberado':'bloqueado'),'info');

// Insere um registro manual (uma batida) e reflete no painel do colaborador
function inserirPontoManual(emp,data,tipo,hora,obs){
  const janta=(tipo==='Saída'&&hora>'18:59');
  const nowIso=new Date().toISOString();
  // Se já existe um registro desse tipo nesse dia, CORRIGE em vez de criar outro — lançar
  // manual de novo pro mesmo dia/tipo antes gerava registros duplicados e conflitantes.
  let r=state.registros.find(x=>x.emp===emp.nome&&x.data===data&&x.tipo===tipo);
  if(r){
    if(r.horaOriginal===undefined)r.horaOriginal=r.hora;
    r.hora=hora;r.ajustado=true;r.manual=true;r.janta=janta;
    r.addr='Ponto lançado manualmente pelo administrador'+(obs?' — '+obs:'');
    r.disp='Lançamento manual (Admin)';r.at=nowIso;
  }else{
    r={id:newId(),emp:emp.nome,data,tipo,hora,
      lat:null,lon:null,addr:'Ponto lançado manualmente pelo administrador'+(obs?' — '+obs:''),
      cidade:'Manual',estado:'RH',prec:0,ip:'—',janta,manual:true,
      disp:'Lançamento manual (Admin)',at:nowIso};
    state.registros.unshift(r);
  }
  const st=state.punchesByEmp[emp.id]||(state.punchesByEmp[emp.id]={});
  const day=st[data]||(st[data]={});
  day[tipo==='Entrada'?'entrada':'saida']={time:hora,manual:true,ip:'—',info:{dev:'Manual',os:'Admin',br:'RH'},at:nowIso};
  // Espelho no Supabase: lançamento manual pelo admin é tão "ponto real" quanto o batido pelo
  // colaborador — sem isso, só entrava na cópia completa (pontoapp_snapshot), não na tabela
  // linha-a-linha (registros_ponto).
  sendRegistroToSupabase(r);
}
function lancarPontoManual(){
  const gv=x=>{const el=document.getElementById(x);return el?el.value:'';};
  const empId=gv('mpEmp');
  const data=gv('mpData')||todayKey();
  const modo=gv('mpModo')||'ambos';
  const hEnt=gv('mpHoraEnt'), hSai=gv('mpHoraSai');
  const obs=(gv('mpObs')||'').trim();
  if(!empId){toast('Selecione o colaborador','Escolha para quem lançar o ponto.','err');return;}
  if(data>todayKey()){toast('Data inválida','Não é possível lançar ponto em data futura.','err');return;}
  const emp=state.employees.find(e=>String(e.id)===String(empId));
  if(!emp){toast('Colaborador não encontrado','Selecione um colaborador válido.','err');return;}
  const lancar=[];
  if(modo==='entrada'||modo==='ambos'){if(!hEnt){toast('Informe o horário de entrada','Preencha o horário de entrada.','err');return;}lancar.push(['Entrada',hEnt]);}
  if(modo==='saida'||modo==='ambos'){if(!hSai){toast('Informe o horário de saída','Preencha o horário de saída.','err');return;}lancar.push(['Saída',hSai]);}
  if(!lancar.length){toast('Nada para lançar','Escolha o que deseja lançar.','err');return;}
  if(modo==='ambos'&&hSai<=hEnt){toast('Horários inválidos','A saída precisa ser depois da entrada.','err');return;}
  lancar.forEach(([tipo,hora])=>inserirPontoManual(emp,data,tipo,hora,obs));
  const resumo=lancar.map(([t,h])=>`${t} ${h}`).join(' • ');
  pushNotif({for:'colab',ic:'➕',c:'var(--c2)',t:'Ponto lançado pelo administrador',s:`${emp.nome} • ${fmtd(data)} • ${resumo}`});
  state.logs.unshift({quem:'Admin',acao:'Abriu ponto manual',alvo:`${emp.nome} • ${fmtd(data)} • ${resumo}`,ip:'187.12.44.9',hora:new Date().toISOString().slice(0,16).replace('T',' ')});
  saveNow();render();
  toast('Ponto lançado',`${emp.nome} • ${fmtd(data)} • ${resumo}.`,'ok');
}

function confirmarExcluirRegistro(i){
  const r=state.registros[i];
  if(!r){closeModal();return;}
  state.registros.splice(i,1);
  deleteRegistroFromSupabase(r.id);
  if(!state.deletedKeys)state.deletedKeys=[];
  state.deletedKeys.push({k:'reg:'+regMergeKey(r),at:new Date().toISOString()});
  // Remove também da linha do tempo do colaborador (punchesByEmp)
  const emp=state.employees.find(e=>e.nome===r.emp);
  if(emp&&state.punchesByEmp[emp.id]&&state.punchesByEmp[emp.id][r.data]){
    const key=r.tipo==='Entrada'?'entrada':'saida';
    delete state.punchesByEmp[emp.id][r.data][key];
    if(!Object.keys(state.punchesByEmp[emp.id][r.data]).length)delete state.punchesByEmp[emp.id][r.data];
  }
  // Remove qualquer ajuste vinculado a esse dia/tipo, para o ponto sumir de vez do espelho e do Acompanhar
  state.adjustments=(state.adjustments||[]).filter(a=>!(a.emp===r.emp&&a.data===r.data&&a.tipo===r.tipo));
  state.logs.unshift({quem:'Admin',acao:'Excluiu registro de ponto',alvo:`${r.emp} • ${r.tipo} ${fmtd(r.data)} ${r.hora}`,ip:'187.12.44.9',hora:new Date().toISOString().slice(0,16).replace('T',' ')});
  pushNotif({for:'colab',ic:'🗑️',c:'var(--s-crit)',t:'Registro de ponto excluído',s:`${r.emp} • ${r.tipo} de ${fmtd(r.data)} às ${r.hora}`});
  saveNow();closeModal();render();
  toast('Registro excluído',`${r.emp} • ${r.tipo} ${fmtd(r.data)}.`,'err');
}

// Aplica o horário aprovado/realizado de um ajuste diretamente no registro de ponto original,
// para que o horário corrigido apareça em TODAS as telas (Registros & Local, Ver ponto, mapa,
// espelho, etc.) e não só nos relatórios que recalculavam por cima. Guarda o horário original
// (horaOriginal) na primeira vez, para manter rastreabilidade do que foi alterado.
function aplicarAjusteNoRegistro(a){
  const emp=state.employees.find(e=>e.nome===a.emp);
  let r=state.registros.find(x=>x.emp===a.emp&&x.data===a.data&&x.tipo===a.tipo);
  const nowIso=new Date().toISOString();
  if(r){
    if(r.horaOriginal===undefined)r.horaOriginal=r.hora;
    r.hora=a.para;
    r.ajustado=true;
    r.ajusteId=a.id;
    r.at=nowIso;
  }else{
    r={id:newId(),emp:a.emp,data:a.data,tipo:a.tipo,hora:a.para,
      lat:null,lon:null,addr:'Registro criado a partir de ajuste aprovado'+(a.obs?' — '+a.obs:''),
      cidade:'Ajuste',estado:'RH',prec:0,ip:'—',manual:true,ajustado:true,ajusteId:a.id,
      disp:'Lançado via ajuste aprovado (Admin)',at:nowIso};
    state.registros.unshift(r);
  }
  if(emp){
    const st=state.punchesByEmp[emp.id]||(state.punchesByEmp[emp.id]={});
    const day=st[a.data]||(st[a.data]={});
    const key=a.tipo==='Entrada'?'entrada':'saida';
    day[key]={time:a.para,manual:true,ajuste:true,ip:'—',info:{dev:'Ajuste',os:'Admin',br:'RH'},at:nowIso};
  }
  // Espelho no Supabase: sem isso, uma correção aprovada só aparecia na cópia completa do
  // estado (pontoapp_snapshot), não na tabela linha-a-linha de pontos (registros_ponto) — o
  // upsert por reg_id corrige o horário se o registro já existia lá, ou cria a linha se o
  // ponto foi lançado do zero a partir do ajuste (não tinha batida original nenhuma).
  sendRegistroToSupabase(r);
}
function realizarAjuste(id){
  const a=state.adjustments.find(x=>x.id===id);
  const hora=document.getElementById('ajHora').value, obs=document.getElementById('ajObs').value;
  const deAntes=a.de&&a.de!=='—'?a.de:a.para; // valor anterior, pra registro auditável no log
  a.de=a.para; a.para=hora; a.status='realizado'; a.obsAdmin=obs;
  a.realizadoEm=new Date().toLocaleDateString('pt-BR');a._ts=Date.now();
  aplicarAjusteNoRegistro(a);
  pushNotif({for:'colab',ic:'✅',c:'var(--s-good)',t:'Ajuste de ponto realizado',
    s:`${a.tipo} de ${fmtd(a.data)} corrigido para ${hora}`});
  state.logs.unshift({quem:'Admin',acao:'Editou ponto (ajuste realizado)',alvo:`${a.emp} • ${a.tipo} ${fmtd(a.data)} • valor anterior ${deAntes} → novo valor ${hora}`,ip:'187.12.44.9',hora:new Date().toISOString().slice(0,16).replace('T',' ')});
  closeModal();renderNav();saveNow();render();toast('Ajuste realizado',a.emp+' foi notificado.','info');
}

  if(_ch){renderNav();scheduleSave();}
  // Esta tela é sempre sobre o período que ACABOU DE TERMINAR — o mesmo que os botões "Fechar
  // Folha"/"Fechar período anterior" fecham (previousPeriod). Antes ela mostrava o período ATUAL
  // (ainda em andamento), então quase nunca batia com quem realmente tinha fechado: a lista de
  // "pontos fechados" ficava vazia ou incompleta, e a impressão em lote (que usa os mesmos dados)
  // parecia "só imprimir 1 colaborador" — na prática estava olhando pro período errado.
  const prevBounds=previousPeriod();

  // em outras telas. "Faltas" não é calculado aqui de propósito: exigiria saber a escala/dias de
  // trabalho esperados de cada colaborador, e um número errado nessa coluna é pior do que não

  const fechRows=fechs.length?fechs.map(x=>`<tr>

  return `${head('Fechamento de Folha','Período '+periodLabel(prevBounds)+' (período encerrado).',

    <div class="sub">Quem já fechou o ponto e enviou para o RH — aparece aqui automaticamente, inclusive quando fecham pelo celular.</div>

// sempre passam bounds explícito). Sem bounds, usa o período ATUAL (em andamento) — pedido do
// administrador: a impressão avulsa ("Imprimir espelho" de qualquer tela) deve sempre refletir

  const b=bounds||currentPeriod();

  const r=collectPonto(empName,inPeriod);
  r.periodo=periodLabel(b);
  return r;
}

// bounds (opcional): imprime um período específico (ex.: um período antigo em "Pontos
// Anteriores", ou o período fechado sendo revisado em "Fechamento de Folha" — esses lugares
// sempre passam bounds explícito). Sem bounds, imprime o período ATUAL (em andamento) — a
// impressão avulsa sempre reflete o período de agora, não o período passado.
function imprimirPonto(emp,bounds){
  // Situação real (não depende mais de state.folha, que nunca chegava a ser preenchido) —
  // fechado se o colaborador já fechou o período em questão, aberto se teve atividade sem
  // fechar, pendência se não teve nenhum registro no período.
  const b=bounds||currentPeriod();
  const fechouSet=new Set(fechadosNoPeriodo(periodKey(b)).map(x=>x.emp));
  const inPeriod=d=>{const dt=new Date(d+'T00:00:00');return dt>=b.start&&dt<=b.end;};
  const status=fechouSet.has(emp)?'fechado':(collectPonto(emp,inPeriod).dias>0?'aberto':'pendencia');
  printHTML(folhaDocHTML(espelhoSection({emp,status},bounds)));
  toast('Espelho gerado',emp+' • use a impressão para salvar em PDF.','info');
}
// Um fechamento por colaborador (sem duplicar) para um período específico.
function fechadosNoPeriodo(pk){
  const porEmp={};
  (state.fechamentos||[]).forEach(f=>{if(f.periodKey===pk&&!porEmp[f.emp])porEmp[f.emp]=f;});
  return Object.values(porEmp);
}
// Colaboradores que já fecharam o ponto do período que TERMINOU — o mesmo período que "Fechar
// Folha"/"Fechar período anterior" fecham (previousPeriod). Antes esta função olhava pro período
// ATUAL (ainda em andamento, currentPeriod), que quase nunca tem fechamentos — é por isso que a
// tela de Fechamento de Folha e a impressão em lote pareciam "não achar" quase ninguém: estavam
// olhando pro período errado (o que ainda não acabou, em vez do que já foi fechado).
function fechadosPeriodoAtual(){
  return fechadosNoPeriodo(periodKey(previousPeriod()));
}
function imprimirFolhaTodos(){
  const fechados=fechadosPeriodoAtual();
  if(!fechados.length){toast('Nada a imprimir','Não há pontos fechados no período.','info');return;}
  const xs=fechados.map(f=>({emp:f.emp,status:'fechado'}));
  // Impressão em lote é sempre sobre o período FECHADO (o que acabou de terminar) — os pontos
  // batidos no período atual, ainda em andamento, não têm nada a ver com esse fechamento. Por
  // isso passa previousPeriod() explícito, em vez de depender do padrão de espelhoSection (que
  // agora é o período atual, para as impressões avulsas em outras telas).
  const pb=previousPeriod();
  const inner=xs.map((x,i)=>`<div class="${i<xs.length-1?'pb':''}">${espelhoSection(x,pb)}</div>`).join('');
  printHTML(folhaDocHTML(inner));
  toast('Impressão em lote',`${xs.length} ponto(s) fechado(s) do período.`,'info');
}
// ===== Imprimir por Período — escolha livre de mês e de quem imprimir (dentro de
// Fechamento de Folha, pedido do administrador). Diferente de "Imprimir todos (fechados)"
// (sempre o período que acabou de fechar) e do "Imprimir" avulso de cada tela (sempre o período
// atual): aqui quem decide o período — passado, atual ou futuro cadastrado — e o alcance

  const pkAtual=periodKey(currentPeriod());
  openModal({content:`<div class="modal-head"><h3>🖨️ Imprimir por Período</h3></div>

function confirmImprimirPorPeriodo(){

  if(!pkRaw){toast('Selecione o período','Escolha o mês do período a imprimir.','err');return;}
  const b=periodBoundsFromKey(pkRaw);
  const quem=document.getElementById('ipQuem').value;
  if(quem==='um'){
    const emp=document.getElementById('ipEmp').value;
    if(!emp){toast('Selecione o colaborador','','err');return;}
    closeModal();
    imprimirPonto(emp,b);

  }
  const ativos=state.employees.filter(e=>e.status!=='inativo');
  if(!ativos.length){toast('Nada a imprimir','Nenhum funcionário cadastrado.','info');return;}
  const fechouSet=new Set(fechadosNoPeriodo(pkRaw).map(x=>x.emp));
  const inPeriod=d=>{const dt=new Date(d+'T00:00:00');return dt>=b.start&&dt<=b.end;};
  const xs=ativos.map(e=>({emp:e.nome,status:fechouSet.has(e.nome)?'fechado':(collectPonto(e.nome,inPeriod).dias>0?'aberto':'pendencia')}));
  const inner=xs.map((x,i)=>`<div class="${i<xs.length-1?'pb':''}">${espelhoSection(x,b)}</div>`).join('');
  closeModal();
  printHTML(folhaDocHTML(inner));
  toast('Impressão em lote',`${xs.length} colaborador(es) • ${periodLabel(b)}.`,'info');
}
// Colaborador com atividade no período informado que ainda não fechou (mesmo critério usado
// pelo aviso "período anterior em aberto" mostrado para o colaborador).
function periodoAbertoPara(nome,bounds){
  const temAtividade=state.registros.some(r=>{
    if(r.emp!==nome||!r.data)return false;
    const dt=new Date(r.data+'T00:00:00');
    return dt>=bounds.start&&dt<=bounds.end;
  });
  return temAtividade&&!isPeriodClosed(nome,bounds);
}
// Fecha o período ANTERIOR (o que já terminou) — é ele que trava o colaborador ao bater ponto
// enquanto não for fechado. Antes este botão só mostrava um toast e não fechava nada de verdade:
// o admin clicava em "Fechar Folha" achando que resolvia para todo mundo, mas o aviso "período
// anterior em aberto" continuava aparecendo pros colaboradores, porque nada era salvo.
function fecharFolha(){
  const prev=previousPeriod();
  const per=periodLabel(prev);
  const pendentes=state.employees.filter(e=>periodoAbertoPara(e.nome,prev));
  openModal({content:`<div class="modal-head"><h3>🔒 Fechar Folha</h3></div>
  <div class="modal-body"><p style="color:var(--text-2)">Confirma o fechamento da folha do período <b>${per}</b> (o período que já terminou)?</p>

function confirmFecharFolha(){
  const prev=previousPeriod();
  const per=periodLabel(prev);
  const pendentes=state.employees.filter(e=>periodoAbertoPara(e.nome,prev));
  pendentes.forEach(e=>{
    closePeriod(e.nome,prev);
    if(!state.fechamentos)state.fechamentos=[];
    state.fechamentos.unshift({emp:e.nome,periodo:per,periodKey:periodKey(prev),tipo:'Fechado pelo administrador',at:new Date().toISOString().slice(0,16).replace('T',' '),_ts:Date.now(),seen:true});

  state.logs.unshift({quem:'Admin',acao:'Fechou folha do período',alvo:per+(pendentes.length?` • ${pendentes.length} colaborador(es): ${pendentes.map(e=>e.nome).join(', ')}`:' • ninguém pendente'),ip:'187.12.44.9',hora:new Date().toISOString().slice(0,16).replace('T',' ')});

        <button class="btn sm ghost" onclick="exportReport('${r[0]}','CSV')">CSV</button>
      </div></div></div>`).join('')}
  </div>`;
}
function reportData(name){
  if(/Registros/.test(name))return {h:['Colaborador','Data','Hora','Tipo','Cidade','UF','Endereço','Precisão','IP','Dispositivo'],
    r:state.registros.map(x=>[x.emp,fmtd(x.data),x.hora,x.tipo,x.cidade,x.estado,x.addr,'±'+x.prec+'m',x.ip,x.disp])};
  if(/Espelho de Ponto/.test(name)){
    const per=currentPeriod();
    const inPeriod=d=>{const dt=new Date(d+'T00:00:00');return dt>=per.start&&dt<=per.end;};
    const rows=[];
    state.employees.forEach(e=>{
      collectPonto(e.nome,inPeriod).rows.forEach(r=>rows.push([e.nome,fmtd(r.data),r.entrada,r.saida,r.total,r.extra,r.janta?'Sim':'Não',r.ajustado?'Sim':'Não']));
    });
    return {h:['Colaborador','Data','Entrada','Saída','Total','Hora Extra','Janta','Ajustado'],r:rows};
  }
  if(/Horas Extras/.test(name)){
    const per=currentPeriod();
    const inPeriod=d=>{const dt=new Date(d+'T00:00:00');return dt>=per.start&&dt<=per.end;};
    const rows=[];
    state.employees.forEach(e=>{
      collectPonto(e.nome,inPeriod).rows.filter(r=>r.extraMin>0).forEach(r=>rows.push([e.nome,fmtd(r.data),r.entrada,r.saida,r.extra]));
    });
    return {h:['Colaborador','Data','Entrada','Saída','Hora Extra'],r:rows};
  }
  if(/Banco de Horas/.test(name)){
    const per=currentPeriod();
    const inPeriod=d=>{const dt=new Date(d+'T00:00:00');return dt>=per.start&&dt<=per.end;};
    const rows=state.employees.map(e=>{
      const d=collectPonto(e.nome,inPeriod);
      return [e.nome,periodLabel(per),d.dias,d.extraTotal,d.jantas];
    });
    return {h:['Colaborador','Período','Dias com ponto','Saldo (Horas Extras)','Jantas'],r:rows};
  }
  if(/Faltas/.test(name)){
    const per=currentPeriod();
    const tk=todayKey();
    const semana=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
    const rows=[];
    state.employees.forEach(e=>{
      const inPeriod=d=>{const dt=new Date(d+'T00:00:00');return dt>=per.start&&dt<=per.end;};
      const comPonto=new Set(collectPonto(e.nome,inPeriod).rows.map(r=>r.data));
      const cur=new Date(per.start);
      while(cur<=per.end){
        const key=cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-'+String(cur.getDate()).padStart(2,'0');
        if(key>tk)break; // não considera dias futuros
        const dow=cur.getDay();
        const emFerias=(state.vacations||[]).some(v=>v.emp===e.nome&&v.status==='agendada'&&key>=v.ini&&key<=v.fim);
        const emAfastamento=(state.afastamentos||[]).some(a=>a.emp===e.nome&&key>=a.ini&&key<=a.fim);
        if(dow!==0&&!feriadoDe(key)&&!emFerias&&!emAfastamento&&!comPonto.has(key))rows.push([e.nome,fmtd(key),semana[dow]]);
        cur.setDate(cur.getDate()+1);
      }
    });
    return {h:['Colaborador','Data','Dia da Semana'],r:rows};
  }
  if(/Atestados/.test(name))return {h:['Colaborador','Tipo','Início','Fim','Dias','Detalhe','Status'],
    r:state.afastamentos.map(a=>[a.emp,a.tipo,fmtd(a.ini),fmtd(a.fim),a.dias,a.det,a.status])};
  if(/Férias/.test(name))return {h:['Colaborador','Início','Fim','Dias','Abono','Status'],
    r:state.vacations.map(v=>[v.emp,fmtd(v.ini),fmtd(v.fim),v.dias,v.abono?'Sim':'Não',v.status])};
  if(/Logs|Auditoria/.test(name))return {h:['Quem','Ação','Alvo','IP','Data/Hora'],r:state.logs.map(l=>[l.quem,l.acao,l.alvo,l.ip,l.hora])};
  if(/Escala/.test(name))return {h:['Escala','Descrição','Horário','Intervalo','Colaboradores'],r:state.escalas.map(e=>[e.nome,e.desc,e.h,e.a,e.n])};
  return {h:['Colaborador','E-mail','Setor','Função','Escala','Jornada','Banco','Status'],
    r:state.employees.map(e=>[e.nome,e.email,e.setor,e.funcao,e.escala,e.jornada,e.banco,e.status])};
}
function dl(blob,fname){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);}
function printHTML(html){
  const f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  document.body.appendChild(f);const d=f.contentWindow.document;d.open();d.write(html);d.close();
  setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.print();}catch(e){}setTimeout(()=>f.remove(),1500);},350);
}
function reportHTML(name,d){
  // Nota: este relatório NÃO é referente a um período de folha (é uma listagem geral, ex.: cadastro
  // de funcionários, férias, auditoria), por isso mostra só a data de geração — nunca um período fixo.
  return `<html><head><meta charset="utf-8"><title>${name}</title><style>
    body{font-family:system-ui,sans-serif;padding:28px;color:#111}h1{font-size:20px;margin:0 0 4px}
    .sub{color:#666;margin:0 0 16px;font-size:13px}table{width:100%;border-collapse:collapse;font-size:12px}
    th,td{border:1px solid #ddd;padding:7px 9px;text-align:left}th{background:#1f3a68;color:#fff}
    tr:nth-child(even){background:#f5f6f8}</style></head><body>
    <h1 style="color:#123a8f">transauto — ${name}</h1><p class="sub">Gerado em ${new Date().toLocaleString('pt-BR')} • ${d.r.length} registro(s)</p>
    <table><tr>${d.h.map(x=>`<th>${x}</th>`).join('')}</tr>
    ${d.r.map(row=>`<tr>${row.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></body></html>`;
}
function exportReport(name,fmt){
  const d=reportData(name),fn=name.replace(/[^\w]+/g,'_');
  if(fmt==='CSV'){
    const csv=[d.h.join(';'),...d.r.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';'))].join('\n');
    dl(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}),fn+'.csv');
  }else if(fmt==='Excel'){
    dl(new Blob([reportHTML(name,d)],{type:'application/vnd.ms-excel'}),fn+'.xls');
  }else{ printHTML(reportHTML(name,d)); }
  toast('Relatório gerado',`${name} • ${fmt}`,'info');
}
function gerarEspelho(nome){
  // Reaproveita o mesmo modelo (e o mesmo período real, sempre o atual) usado pelo admin em
  // imprimirPonto — antes esta função tinha seu próprio texto de período FIXO, sem nunca
  // atualizar, o que fazia aparecer sempre "16/06 – 15/07" independente do mês real.
  const quem=nome||(state.user?state.user.nome:'Colaborador');
  imprimirPonto(quem);
}
function adminLogs(){
  const rows=state.logs.map(l=>`<tr><td><b>${l.quem}</b></td><td>${l.acao}</td><td>${l.alvo}</td>
    <td><code style="font-size:12px">${l.ip}</code></td><td style="white-space:nowrap">${l.hora}</td></tr>`).join('');
  return `${head('Auditoria','Trilha completa e imutável — nada é apagado.',
    `<button class="btn ghost" onclick="exportReport('Logs','CSV')">📥 Exportar</button>`)}
  <div class="card"><div class="tbl-wrap"><table>
    <thead><tr><th>Quem</th><th>Ação</th><th>Alvo / Detalhe</th><th>IP</th><th>Data / Hora</th></tr></thead>
    <tbody>${rows}</tbody></table></div></div>`;
}

/* ============================ HELPERS ============================ */
function head(t,s,actions=''){return `<div class="page-head"><div><h2>${t}</h2><p>${s}</p></div>${actions?`<div class="actions">${actions}</div>`:''}</div>`;}
function kpi(ic,c,lbl,val,arg1='',arg2=''){
  let delta='';const dir=(arg1==='up'||arg1==='down')?arg1:'';
  if(dir)delta=`<span class="delta ${dir}">${dir==='up'?'▲':'▼'} ${arg2||''}</span>`;
  const sub=dir?'':(arg1||arg2);
  return `<div class="card"><div class="kpi"><div class="top"><div class="ic" style="background:${c}">${ic}</div>${delta}</div>
    <div class="val">${val}</div><div class="lbl">${lbl}</div>${sub?`<div style="color:var(--muted);font-size:12px">${sub}</div>`:''}</div></div>`;
}
function fmtd(iso){const [y,m,d]=iso.split('-');return `${d}/${m}/${y.slice(2)}`;}
function diaSemanaExt(iso){const dt=new Date(iso+'T12:00:00');return ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'][dt.getDay()];}

initSupabase();
